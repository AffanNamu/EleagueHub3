name = "livekit-token-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[vars]
LIVEKIT_URL = "wss://esportlyic-tnvub6ag.livekit.cloud"
FIREBASE_PROJECT_ID = "esportlyic"
ANDROID_PACKAGE_NAME = "com.eleaguehub.app"
# Same cloud name already baked into the Flutter client's dart-defines
# (CLOUDINARY_CLOUD_NAME) -- not secret, matches convention of the other
# plain vars above.
CLOUDINARY_CLOUD_NAME = "dbw9zpkxi"

# Football Hub live-score poller (_pollLiveFixturesAndNotify in
# src/index.js). Runs hourly = 24 fixed API-Football requests/day, leaving
# headroom on the free 100/day plan for the variable per-goal scorer
# lookup (only for matches at least one user follows) and for everything
# else (Matches tab, Standings, etc.). A notification can arrive up to ~1h
# after the real event at this interval -- that's the free-tier tradeoff,
# not a bug. Once on a higher-quota API-Football plan, tighten this to
# e.g. "*/2 * * * *" (every 2 min) for real-time notifications; nothing
# else about the pipeline needs to change.
[triggers]
crons = ["0 * * * *"]