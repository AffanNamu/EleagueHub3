plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty("flutter.sdk")

if (flutterRoot == null) {
    flutterRoot = System.getenv("FLUTTER_ROOT")
}

if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define flutter.sdk in local.properties or set FLUTTER_ROOT.")
}

android {

    namespace "com.eleaguehub.app"

    compileSdk 34

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17

        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true

    }

    kotlinOptions {

        jvmTarget = '17'

    }

    defaultConfig {

        applicationId "com.eleaguehub.app"

        minSdkVersion 23

        targetSdkVersion 34

        versionCode 7

        versionName "1.0.6"

        multiDexEnabled true

    }

    packagingOptions {

        pickFirst 'lib/**/libc++_shared.so'

    }

    buildTypes {

        release {

            signingConfig signingConfigs.debug

            shrinkResources false

            minifyEnabled false

        }

    }

}

dependencies {

    implementation "androidx.multidex:multidex:2.0.1"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

}

flutter {

    source "../.."

}
