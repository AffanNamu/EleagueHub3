plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "21"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.4.0"
}

// ─── KEYSTORE SETUP ───────────────────────────────────────────────
// Priority 1: Environment variables (GitHub Actions)
// Priority 2: key.properties file (local development)
// Priority 3: debug keystore (fallback)

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

// Check if env vars are set (GitHub Actions)
def envKeystorePath = System.getenv("KEYSTORE_PATH")
def envStorePassword = System.getenv("STORE_PASSWORD")
def envKeyAlias = System.getenv("KEY_ALIAS")
def envKeyPassword = System.getenv("KEY_PASSWORD")

def hasEnvKeystore = envKeystorePath != null && 
                     new File(envKeystorePath).exists() &&
                     envStorePassword != null &&
                     envKeyAlias != null &&
                     envKeyPassword != null

def hasFileKeystore = keystorePropertiesFile.exists()

if (hasFileKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ──────────────────────────────────────────────────────────────────

flutter {
    source '../..'
}

android {
    namespace "com.eleaguehub.app"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (hasEnvKeystore) {
                // ✅ GitHub Actions path
                println "Using RELEASE keystore from environment variables"
                storeFile file(envKeystorePath)
                storePassword envStorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            } else if (hasFileKeystore) {
                // ✅ Local development path  
                println "Using RELEASE keystore from key.properties"
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            } else {
                // ⚠️ Fallback to debug (not for Play Store!)
                println "WARNING: Using DEBUG keystore for release build!"
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.eleaguehub.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-ads:23.0.0"
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    def media3Version = "1.3.1"
    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "androidx.media3:media3-effect:$media3Version"
}
