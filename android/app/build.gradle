//app build gradle
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "21"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.5.0"
}

// ─── KEYSTORE SETUP ───────────────────────────────────────────────
// Priority 1: Environment variables (GitHub Actions)
// Priority 2: key.properties file (local development)
// Priority 3: debug keystore (fallback)

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

// Check if env vars are set (GitHub Actions)
def envKeystorePath = System.getenv("KEYSTORE_PATH")
def envStorePassword = System.getenv("STORE_PASSWORD")
def envKeyAlias = System.getenv("KEY_ALIAS")
def envKeyPassword = System.getenv("KEY_PASSWORD")

def hasEnvKeystore = envKeystorePath != null && 
                     new File(envKeystorePath).exists() &&
                     envStorePassword != null &&
                     envKeyAlias != null &&
                     envKeyPassword != null

def hasFileKeystore = keystorePropertiesFile.exists()

if (hasFileKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ──────────────────────────────────────────────────────────────────

flutter {
    source '../..'
}

android {
    namespace "com.eleaguehub.app"
    compileSdk 36

    // 16 KB PAGE SIZE FIX (corrected):
    // The previous pin here was ndkVersion "27.0.12077973" (NDK r27), with a
    // comment claiming r27 makes 16 KB alignment "the default." That claim is
    // wrong. Per Google's own docs (developer.android.com/guide/practices/page-sizes):
    // "NDK version r28 and higher compile 16 KB-aligned by default. To support
    // compiling 16 KB-aligned shared libraries with NDK r27 or lower, use the
    // linker flags -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384."
    // r27 only added the *capability* (opt-in); r28 is what turns it on by
    // default. This project has no externalNativeBuild/CMake block, so it
    // doesn't compile any native code itself — this setting alone will not
    // realign prebuilt .so files that ship inside the Flutter engine or
    // third-party plugin AARs (those are baked in by whichever NDK version
    // *their* authors used). It is still the correct, Google-recommended
    // toolchain baseline, and it matters immediately if any Gradle-level
    // native compilation is ever added later.
    ndkVersion "28.0.13004108"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (hasEnvKeystore) {
                // ✅ GitHub Actions path
                println "Using RELEASE keystore from environment variables"
                storeFile file(envKeystorePath)
                storePassword envStorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            } else if (hasFileKeystore) {
                // ✅ Local development path  
                println "Using RELEASE keystore from key.properties"
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            } else {
                // ⚠️ Fallback to debug (not for Play Store!)
                println "WARNING: Using DEBUG keystore for release build!"
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.eleaguehub.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release

            // R8 / OBFUSCATION FIX:
            // Both flags were previously false, so R8 never ran in shrink/obfuscate
            // mode on release builds — only the desugaring pass ran. That is exactly
            // why Play Console reports ~1% obfuscation (below its 25% threshold):
            // there was nothing for R8 to rename or remove. Turning both on lets R8
            // actually shrink and obfuscate the release build. proguard-rules.pro
            // (see separate file) carries only the small set of targeted keep rules
            // Flutter release builds are documented to need; it is not a broad
            // "keep everything" rule set.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-ads:23.0.0"
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    def media3Version = "1.3.1"
    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "androidx.media3:media3-effect:$media3Version"
}
