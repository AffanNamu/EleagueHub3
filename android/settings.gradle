pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")

        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }

        // 1) Prefer flutter.sdk from android/local.properties
        def sdkPath = properties.getProperty("flutter.sdk")

        // 2) Fallback to CI env var
        if (sdkPath == null || sdkPath.trim().isEmpty()) {
            sdkPath = System.getenv("FLUTTER_ROOT")
        }

        assert sdkPath != null && !sdkPath.trim().isEmpty() :
                "Flutter SDK not found. Set flutter.sdk in android/local.properties or set FLUTTER_ROOT."

        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"

    // Bumped AGP to support newer compileSdk values (like 35)
    id "com.android.application" version "8.3.2" apply false

    // Kotlin compatible with modern AGP/Flutter
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false

    // Firebase/Google plugins (versions must be declared here)
    id "com.google.gms.google-services" version "4.4.1" apply false
    id "com.google.firebase.crashlytics" version "3.0.2" apply false
}

include ":app"
