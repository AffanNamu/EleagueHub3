allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects { project ->
    /**
     * IMPORTANT:
     * Do NOT set project.ext.flutter for :app because Flutter's Gradle plugin
     * creates/uses a `flutter { ... }` extension there (needs flutter.source).
     *
     * Some Android library subprojects may reference `flutter.compileSdkVersion`
     * without having the Flutter extension, so we provide a fallback ONLY for non-app modules.
     */
    if (project.path != ':app' && !project.hasProperty('flutter') && project.extensions.findByName('flutter') == null) {
        project.ext.set('flutter', [
            compileSdkVersion: 35,
            minSdkVersion: 23,
            targetSdkVersion: 35,
        ])
    }

    afterEvaluate {
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null || namespace.toString().trim().isEmpty()) {
                    namespace = "com.eleaguehub.generated.${project.name.replace('-', '_')}"
                }
                compileSdkVersion 35
            }
        }
    }

    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
