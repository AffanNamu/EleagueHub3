buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// This block runs BEFORE each subproject's build.gradle is evaluated,
// so the flutter property is available when plugins like record_android
// reference flutter.compileSdkVersion at evaluation time.
subprojects { project ->
    if (!project.hasProperty('flutter')) {
        project.ext.flutter = [
            compileSdkVersion: 35,
            minSdkVersion: 21,
            targetSdkVersion: 35,
            versionCode: 1,
            versionName: '1.0',
        ]
    }

    afterEvaluate {
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null || namespace.toString().trim().isEmpty()) {
                    namespace = "com.eleaguehub.generated.${project.name.replace('-', '_')}"
                }
                compileSdkVersion 35
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
