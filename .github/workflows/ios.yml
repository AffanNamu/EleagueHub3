name: iOS CI (Release IPA - Production)

on:
  push:
    branches: [ main ]
    # Scoped to what can actually affect the iOS build/archive/upload --
    # without this, every push to main (web_client/, esportlyic-admin/,
    # worker/, docs, firestore config, etc.) triggers a full iOS CI run,
    # and the concurrency group below then cancels any iOS run already
    # in progress, which repeatedly delayed real iOS work this session.
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macos-15 (Xcode 16.4 / iOS 18.5 SDK) now fails App Store Connect
    # upload validation: "All iOS and iPadOS apps must be built with
    # the iOS 26 SDK or later, included in Xcode 26 or later" (Apple's
    # new minimum-SDK requirement, confirmed via run #71's altool
    # error -- the archive/signing/upload itself all succeeded, only
    # Apple's server-side submission check rejected the SDK version).
    # macos-26 runners default to Xcode 26.6 as of 2026-07-21 (GA since
    # 2026-02-26), which satisfies this.
    runs-on: macos-26
    timeout-minutes: 90

    env:
      CLOUDINARY_CLOUD_NAME: dbw9zpkxi
      CLOUDINARY_UNSIGNED_UPLOAD_PRESET: eSportlyic_unsigned
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      BUNDLE_ID: com.eleaguehub.app
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}

    steps:
      # ─────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────
      - name: Checkout (with retries)
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          ok=0
          for i in 1 2 3 4 5 6; do
            echo "Checkout attempt ${i}/6..."
            find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} + || true
            rm -rf .git || true
            git init -q
            git config gc.auto 0
            git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
            if git -c protocol.version=2 fetch \
                --no-tags --prune --no-recurse-submodules \
                --depth=1 origin "${SHA}"; then
              git checkout --detach -q FETCH_HEAD
              echo "✅ Checked out: $(git rev-parse HEAD)"
              ok=1
              break
            fi
            sleep $((i * 15))
          done
          [ "${ok}" -eq 1 ] || { echo "ERROR: Checkout failed"; exit 1; }

      # ─────────────────────────────────────────
      # 2. PREPARE DIRECTORIES
      # ─────────────────────────────────────────
      - name: Prepare directories
        run: mkdir -p "${PUB_CACHE}"

      # ─────────────────────────────────────────
      # 3. CACHES
      # ─────────────────────────────────────────
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      # ─────────────────────────────────────────
      # 4. FLUTTER (same version pin as android.yml — keep in sync)
      # ─────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          flutter config --no-analytics
          # Flutter 3.47.1 enables Swift Package Manager for iOS by default,
          # which stops it from generating the legacy ios/.symlinks/plugins/*
          # directory structure our hand-rolled Podfile depends on
          # (flutter_install_all_ios_pods needs those symlinks to declare
          # each plugin's local pod). Confirmed via CI diagnostic: with SPM
          # on, ios/.symlinks/plugins/ doesn't exist at all, which is why
          # pod install failed with "No podspec found for
          # webview_flutter_wkwebview" — not specific to that one plugin,
          # every plugin's local pod path was broken the same way.
          flutter config --no-enable-swift-package-manager
          flutter doctor -v

      # ─────────────────────────────────────────
      # 4b. GENERATE iOS PLATFORM PROJECT IF MISSING
      # You're building entirely from GitHub Actions (no local Mac), so
      # this has to happen here, every run, not on a developer machine.
      # `flutter create` is idempotent/safe to re-run — it only fills in
      # missing platform files, it will not overwrite your lib/ Dart code.
      #
      # MUST run before `flutter pub get` below: Flutter's tooling only
      # symlinks each plugin's native pod into ios/.symlinks/plugins/*/ios
      # when it recognizes the project as having iOS platform support
      # (i.e. ios/Flutter/ already exists). Running pub get first left
      # purely-transitive iOS plugins (e.g. webview_flutter_wkwebview,
      # pulled in by google_mobile_ads) unsymlinked, causing CocoaPods to
      # fail with "No podspec found for `webview_flutter_wkwebview`".
      # ─────────────────────────────────────────
      - name: Ensure iOS platform project exists
        run: |
          set -euo pipefail
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "No ios/ Xcode project found — generating it now."
            flutter create --platforms=ios .

            # `flutter create` derives the bundle identifier as
            # <org>.<pubspec-name>, i.e. com.eleaguehub.eleaguehub3 — not
            # com.eleaguehub.app, which is what Android's applicationId,
            # the AdMob/Firebase config, and the Apple provisioning
            # profile/certificate were all issued against. Confirmed via
            # a real CI failure: "Provisioning profile ... has app ID
            # com.eleaguehub.app, which does not match the bundle ID
            # com.eleaguehub.eleaguehub3." Patch it to the real bundle ID.
            sed -i '' \
              's/PRODUCT_BUNDLE_IDENTIFIER = com\.eleaguehub\.eleaguehub3/PRODUCT_BUNDLE_IDENTIFIER = com.eleaguehub.app/g' \
              ios/Runner.xcodeproj/project.pbxproj
            echo "── PRODUCT_BUNDLE_IDENTIFIER after patch ──"
            grep "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj
          else
            echo "ios/ Xcode project already present in repo — skipping generation."
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      # ─────────────────────────────────────────
      # 4c. OVERLAY ANDROID-DERIVED iOS CONFIG
      # Writes Info.plist, Podfile, entitlements, AppDelegate.swift, and
      # HighlightCompressionEngine.swift (the iOS AVFoundation counterpart
      # to android/.../HighlightCompressionEngine.kt) — same content as
      # ios_scaffold.sh, run here instead of locally. The new Swift file
      # still needs registering with the Xcode project as a Runner source
      # file — see step 4e below, which already does the equivalent for
      # GoogleService-Info.plist as a Resources entry.
      # ─────────────────────────────────────────
      - name: Write iOS Info.plist, Podfile, entitlements, AppDelegate
        run: |
          set -euo pipefail
          mkdir -p ios/Runner

          cat > ios/Runner/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>$(DEVELOPMENT_LANGUAGE)</string>
          	<key>CFBundleExecutable</key>
          	<string>$(EXECUTABLE_NAME)</string>
          	<key>CFBundleIdentifier</key>
          	<string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>eleaguehub3</string>
          	<key>CFBundleDisplayName</key>
          	<string>eSportlyic</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>$(FLUTTER_BUILD_NAME)</string>
          	<key>CFBundleVersion</key>
          	<string>$(FLUTTER_BUILD_NUMBER)</string>
          	<key>CFBundleSignature</key>
          	<string>????</string>
          	<key>CFBundleURLTypes</key>
          	<array>
          		<dict>
          			<key>CFBundleURLName</key>
          			<string>com.eleaguehub.app.deeplink</string>
          			<key>CFBundleURLSchemes</key>
          			<array>
          				<string>esportlyic</string>
          			</array>
          		</dict>
          		<dict>
          			<key>CFBundleURLName</key>
          			<string>com.eleaguehub.app.googlesignin</string>
          			<key>CFBundleURLSchemes</key>
          			<array>
          				<string>${GOOGLE_REVERSED_CLIENT_ID}</string>
          			</array>
          		</dict>
          	</array>
          	<key>NSCameraUsageDescription</key>
          	<string>eSportlyic uses your camera to scan QR codes, capture profile/media content, and enable video during live league sessions.</string>
          	<key>NSMicrophoneUsageDescription</key>
          	<string>eSportlyic uses your microphone for voice chat and audio during live league sessions and recordings.</string>
          	<key>NSPhotoLibraryUsageDescription</key>
          	<string>eSportlyic needs access to your photo library to let you select images and media to upload.</string>
          	<key>NSPhotoLibraryAddUsageDescription</key>
          	<string>eSportlyic saves media you create or download to your photo library when you choose to.</string>
          	<key>NSLocalNetworkUsageDescription</key>
          	<string>eSportlyic uses your local network to establish low-latency audio/video connections during live league sessions.</string>
          	<key>GADApplicationIdentifier</key>
          	<string>${IOS_ADMOB_APP_ID}</string>
          	<key>SKAdNetworkItems</key>
          	<array>
          		<dict>
          			<key>SKAdNetworkIdentifier</key>
          			<string>cstr6suwn9.skadnetwork</string>
          		</dict>
          	</array>
          	<key>UIBackgroundModes</key>
          	<array>
          		<string>audio</string>
          		<string>remote-notification</string>
          	</array>
          	<key>ITSAppUsesNonExemptEncryption</key>
          	<false/>
          	<key>UILaunchStoryboardName</key>
          	<string>LaunchScreen</string>
          	<key>UIMainStoryboardFile</key>
          	<string>Main</string>
          	<key>UIApplicationSupportsIndirectInputEvents</key>
          	<true/>
          	<key>CADisableMinimumFrameDurationOnPhone</key>
          	<true/>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          		<string>UIInterfaceOrientationLandscapeLeft</string>
          		<string>UIInterfaceOrientationLandscapeRight</string>
          	</array>
          	<key>UISupportedInterfaceOrientations~ipad</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          		<string>UIInterfaceOrientationPortraitUpsideDown</string>
          		<string>UIInterfaceOrientationLandscapeLeft</string>
          		<string>UIInterfaceOrientationLandscapeRight</string>
          	</array>
          </dict>
          </plist>
          PLIST

          cat > ios/Runner/Runner.entitlements <<'ENTITLEMENTS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>aps-environment</key>
          	<string>production</string>
          	<key>com.apple.developer.applesignin</key>
          	<array>
          		<string>Default</string>
          	</array>
          	<key>com.apple.developer.associated-domains</key>
          	<array>
          		<string>applinks:esportlyic.com</string>
          		<string>applinks:www.esportlyic.com</string>
          	</array>
          </dict>
          </plist>
          ENTITLEMENTS

          cat > ios/Podfile <<'PODFILE'
          # Flutter 3.47+ bumped the engine pod's own minimum to iOS 15.0 —
          # CocoaPods fails to resolve the "Flutter" pod if this is lower.
          platform :ios, '15.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          PODFILE

          cat > ios/Runner/AppDelegate.swift <<'SWIFT'
          import Flutter
          import UIKit
          import Firebase
          import GoogleMobileAds
          import GoogleSignIn

          @main
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              FirebaseApp.configure()
              MobileAds.shared.start(completionHandler: nil)
              application.registerForRemoteNotifications()
              GeneratedPluginRegistrant.register(with: self)

              // Highlights compression (iOS AVFoundation counterpart to
              // Android's HighlightCompressionEngine.kt) -- mirrors exactly
              // where MainActivity.configureFlutterEngine registers the
              // Android side, right after plugin registration.
              if let controller = window?.rootViewController as? FlutterViewController {
                HighlightCompressionEngine.register(messenger: controller.binaryMessenger)
              }

              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }

            // google_sign_in: when the account picker hands off to the Google app
            // (if installed) or an external browser instead of staying in-app, iOS
            // returns control via this URL callback, not a normal completion
            // handler. Without routing it to GIDSignIn, the plugin's signIn()
            // future never resolves or rejects -- the user picks an account and
            // the app just sits on its loading spinner until Dart's own timeout
            // eventually fires, instead of ever coming back into the app.
            override func application(
              _ app: UIApplication,
              open url: URL,
              options: [UIApplication.OpenURLOptionsKey: Any] = [:]
            ) -> Bool {
              if GIDSignIn.sharedInstance.handle(url) {
                return true
              }
              return super.application(app, open: url, options: options)
            }
          }
          SWIFT
          cat > ios/Runner/HighlightCompressionEngine.swift <<'HIGHLIGHT_SWIFT'
          // ios/Runner/HighlightCompressionEngine.swift
          //
          // iOS counterpart to android/app/src/main/kotlin/com/eleaguehub/app/
          // HighlightCompressionEngine.kt -- implements the SAME wire contract the
          // Dart side (lib/features/highlights/data/video_compression_service.dart)
          // already hardcodes, so no Dart changes are needed for this to work:
          //
          //   MethodChannel "highlight_compression":
          //     - "probe" { inputPath } -> { durationSeconds, width, height, format }
          //     - "compress" { taskId, inputPath, outputPath, maxHeight,
          //                     videoBitrateKbps, audioBitrateKbps }
          //                   -> { outputPath, outputBytes, usedMaxHeight,
          //                        usedVideoBitrateKbps, usedAudioBitrateKbps }
          //   EventChannel "highlight_compression_progress":
          //     emits { taskId, progress01 } best-effort.
          //
          // Unlike Android's Media3 Transformer (a single high-level call), iOS has
          // no API that accepts an explicit target bitrate -- AVAssetExportSession
          // only offers fixed named quality presets. Hitting the same "bitrate
          // computed from a size/duration budget" policy the Dart layer already
          // enforces requires the lower-level AVAssetReader -> AVAssetWriter
          // pipeline used below: read decompressed samples, scale video via an
          // AVVideoComposition's renderSize, re-encode H.264/AAC at the exact
          // requested bitrates, write out.
          //
          // NOTE: this file cannot be compiled/tested in this environment (no
          // macOS/Xcode toolchain here) -- it was written to well-established
          // AVFoundation reader/writer patterns and reviewed carefully, but the
          // first real CI build + a real device/TestFlight run is the actual test.

          import AVFoundation
          import Flutter
          import Foundation

          final class HighlightCompressionEngine: NSObject, FlutterStreamHandler {
              static let shared = HighlightCompressionEngine()

              private let queue = DispatchQueue(label: "com.eleaguehub.app.highlight_compression")
              private var progressSink: FlutterEventSink?
              private var busy = false
              private var activeTaskId: String?

              static func register(messenger: FlutterBinaryMessenger) {
                  let methodChannel = FlutterMethodChannel(name: "highlight_compression", binaryMessenger: messenger)
                  methodChannel.setMethodCallHandler { call, result in
                      switch call.method {
                      case "probe":
                          shared.handleProbe(call: call, result: result)
                      case "compress":
                          shared.handleCompress(call: call, result: result)
                      default:
                          result(FlutterMethodNotImplemented)
                      }
                  }

                  let progressChannel = FlutterEventChannel(name: "highlight_compression_progress", binaryMessenger: messenger)
                  progressChannel.setStreamHandler(shared)
              }

              // MARK: - FlutterStreamHandler

              func onListen(withArguments arguments: Any?, eventSink events: @escaping FlutterEventSink) -> FlutterError? {
                  progressSink = events
                  return nil
              }

              func onCancel(withArguments arguments: Any?) -> FlutterError? {
                  progressSink = nil
                  return nil
              }

              private func emitProgress(taskId: String, progress01: Double) {
                  guard let sink = progressSink else { return }
                  let p = max(0.0, min(1.0, progress01))
                  DispatchQueue.main.async {
                      sink(["taskId": taskId, "progress01": p])
                  }
              }

              // MARK: - Input path handling

              // image_picker/file_picker on iOS return plain filesystem paths (iOS
              // has no content:// URI scheme, unlike Android), but tolerate a
              // file:// URL string too, defensively.
              private static func assetURL(for inputPath: String) -> URL {
                  let trimmed = inputPath.trimmingCharacters(in: .whitespacesAndNewlines)
                  if trimmed.hasPrefix("file://"), let url = URL(string: trimmed) {
                      return url
                  }
                  return URL(fileURLWithPath: trimmed)
              }

              // MARK: - probe

              private func handleProbe(call: FlutterMethodCall, result: @escaping FlutterResult) {
                  guard let args = call.arguments as? [String: Any],
                        let inputPath = (args["inputPath"] as? String)?.trimmingCharacters(in: .whitespacesAndNewlines),
                        !inputPath.isEmpty else {
                      result(FlutterError(code: "BAD_ARGS", message: "inputPath is required", details: nil))
                      return
                  }

                  queue.async {
                      let url = HighlightCompressionEngine.assetURL(for: inputPath)
                      let asset = AVURLAsset(url: url)

                      // Deliberately using the synchronous AVAsset properties (not the
                      // newer async load(.duration)/load(.tracks) API) -- deprecated
                      // on newer SDKs but still fully functional, and avoids adding
                      // async/await control flow this file otherwise doesn't need.
                      let durationSeconds = CMTimeGetSeconds(asset.duration)
                      var width = 0
                      var height = 0
                      if let track = asset.tracks(withMediaType: .video).first {
                          let size = track.naturalSize.applying(track.preferredTransform)
                          width = Int(abs(size.width))
                          height = Int(abs(size.height))
                      }

                      let response: [String: Any] = [
                          "durationSeconds": durationSeconds.isFinite ? durationSeconds : 0.0,
                          "width": max(0, width),
                          "height": max(0, height),
                          "format": "mp4",
                      ]

                      DispatchQueue.main.async {
                          result(response)
                      }
                  }
              }

              // MARK: - compress

              private func handleCompress(call: FlutterMethodCall, result: @escaping FlutterResult) {
                  guard busy == false else {
                      result(FlutterError(code: "BUSY", message: "Compression is already running.", details: nil))
                      return
                  }

                  guard let args = call.arguments as? [String: Any],
                        let taskId = (args["taskId"] as? String)?.trimmingCharacters(in: .whitespacesAndNewlines), !taskId.isEmpty,
                        let inputPath = (args["inputPath"] as? String)?.trimmingCharacters(in: .whitespacesAndNewlines), !inputPath.isEmpty,
                        let outputPath = (args["outputPath"] as? String)?.trimmingCharacters(in: .whitespacesAndNewlines), !outputPath.isEmpty
                  else {
                      result(FlutterError(code: "BAD_ARGS", message: "taskId, inputPath, outputPath are required", details: nil))
                      return
                  }

                  let maxHeight = (args["maxHeight"] as? NSNumber)?.intValue ?? 720
                  let videoBitrateKbps = (args["videoBitrateKbps"] as? NSNumber)?.intValue ?? 1500
                  let audioBitrateKbps = (args["audioBitrateKbps"] as? NSNumber)?.intValue ?? 128

                  busy = true
                  activeTaskId = taskId
                  emitProgress(taskId: taskId, progress01: 0)

                  queue.async {
                      self.runCompression(
                          taskId: taskId,
                          inputPath: inputPath,
                          outputPath: outputPath,
                          maxHeight: maxHeight,
                          videoBitrateKbps: videoBitrateKbps,
                          audioBitrateKbps: audioBitrateKbps
                      ) { outcome in
                          self.busy = false
                          self.activeTaskId = nil
                          DispatchQueue.main.async {
                              switch outcome {
                              case .success(let payload):
                                  result(payload)
                              case .failure(let message):
                                  result(FlutterError(code: "COMPRESS_FAILED", message: message, details: nil))
                              }
                          }
                      }
                  }
              }

              private enum CompressOutcome {
                  case success([String: Any])
                  case failure(String)
              }

              private func runCompression(
                  taskId: String,
                  inputPath: String,
                  outputPath: String,
                  maxHeight: Int,
                  videoBitrateKbps: Int,
                  audioBitrateKbps: Int,
                  completion: @escaping (CompressOutcome) -> Void
              ) {
                  let inputURL = HighlightCompressionEngine.assetURL(for: inputPath)
                  let outputURL = URL(fileURLWithPath: outputPath)

                  // AVAssetWriter refuses to write to a path that already exists.
                  try? FileManager.default.removeItem(at: outputURL)

                  let asset = AVURLAsset(url: inputURL)
                  guard let videoTrack = asset.tracks(withMediaType: .video).first else {
                      completion(.failure("No video track found in input file."))
                      return
                  }

                  let naturalSize = videoTrack.naturalSize.applying(videoTrack.preferredTransform)
                  let inputWidth = abs(naturalSize.width)
                  let inputHeight = abs(naturalSize.height)
                  guard inputWidth > 0, inputHeight > 0 else {
                      completion(.failure("Could not determine input video dimensions."))
                      return
                  }

                  let clampedMaxHeight = CGFloat(max(240, min(maxHeight, 720)))
                  let scale = min(1.0, clampedMaxHeight / inputHeight)
                  // Even width/height -- H.264 encoders require this.
                  var scaledWidth = Int((inputWidth * scale).rounded(.down))
                  var scaledHeight = Int((inputHeight * scale).rounded(.down))
                  if scaledWidth % 2 != 0 { scaledWidth -= 1 }
                  if scaledHeight % 2 != 0 { scaledHeight -= 1 }
                  scaledWidth = max(2, scaledWidth)
                  scaledHeight = max(2, scaledHeight)

                  let reader: AVAssetReader
                  let writer: AVAssetWriter
                  do {
                      reader = try AVAssetReader(asset: asset)
                      writer = try AVAssetWriter(outputURL: outputURL, fileType: .mp4)
                  } catch {
                      completion(.failure("Failed to initialize reader/writer: \(error.localizedDescription)"))
                      return
                  }

                  // Video: read via a video-composition output so we can scale
                  // during the pipeline (renderSize), rather than reading native-size
                  // frames and resizing pixel buffers by hand.
                  let videoComposition = AVMutableVideoComposition(propertiesOf: asset)
                  videoComposition.renderSize = CGSize(width: scaledWidth, height: scaledHeight)

                  let videoReaderOutput = AVAssetReaderVideoCompositionOutput(
                      videoTracks: asset.tracks(withMediaType: .video),
                      videoSettings: [kCVPixelBufferPixelFormatTypeKey as String: kCVPixelFormatType_32BGRA]
                  )
                  videoReaderOutput.videoComposition = videoComposition
                  guard reader.canAdd(videoReaderOutput) else {
                      completion(.failure("Reader cannot accept video output."))
                      return
                  }
                  reader.add(videoReaderOutput)

                  let audioTrack = asset.tracks(withMediaType: .audio).first
                  var audioReaderOutput: AVAssetReaderTrackOutput?
                  if let audioTrack = audioTrack {
                      let out = AVAssetReaderTrackOutput(track: audioTrack, outputSettings: nil)
                      if reader.canAdd(out) {
                          reader.add(out)
                          audioReaderOutput = out
                      }
                  }

                  let videoWriterSettings: [String: Any] = [
                      AVVideoCodecKey: AVVideoCodecType.h264,
                      AVVideoWidthKey: scaledWidth,
                      AVVideoHeightKey: scaledHeight,
                      AVVideoCompressionPropertiesKey: [
                          AVVideoAverageBitRateKey: videoBitrateKbps * 1000,
                          AVVideoProfileLevelKey: AVVideoProfileLevelH264HighAutoLevel,
                      ],
                  ]
                  let videoWriterInput = AVAssetWriterInput(mediaType: .video, outputSettings: videoWriterSettings)
                  videoWriterInput.expectsMediaDataInRealTime = false
                  guard writer.canAdd(videoWriterInput) else {
                      completion(.failure("Writer cannot accept video input."))
                      return
                  }
                  writer.add(videoWriterInput)

                  var audioWriterInput: AVAssetWriterInput?
                  if audioReaderOutput != nil {
                      let audioWriterSettings: [String: Any] = [
                          AVFormatIDKey: kAudioFormatMPEG4AAC,
                          AVSampleRateKey: 44100,
                          AVNumberOfChannelsKey: 2,
                          AVEncoderBitRateKey: audioBitrateKbps * 1000,
                      ]
                      let input = AVAssetWriterInput(mediaType: .audio, outputSettings: audioWriterSettings)
                      input.expectsMediaDataInRealTime = false
                      if writer.canAdd(input) {
                          writer.add(input)
                          audioWriterInput = input
                      }
                  }

                  guard reader.startReading() else {
                      completion(.failure("Failed to start reading: \(reader.error?.localizedDescription ?? "unknown")"))
                      return
                  }
                  guard writer.startWriting() else {
                      completion(.failure("Failed to start writing: \(writer.error?.localizedDescription ?? "unknown")"))
                      return
                  }
                  writer.startSession(atSourceTime: .zero)

                  let totalDurationSeconds = CMTimeGetSeconds(asset.duration)
                  let pumpGroup = DispatchGroup()

                  pumpGroup.enter()
                  let videoPumpQueue = DispatchQueue(label: "com.eleaguehub.app.highlight_compression.video")
                  videoWriterInput.requestMediaDataWhenReady(on: videoPumpQueue) {
                      while videoWriterInput.isReadyForMoreMediaData {
                          if let sample = videoReaderOutput.copyNextSampleBuffer() {
                              if totalDurationSeconds > 0 {
                                  let pts = CMTimeGetSeconds(CMSampleBufferGetPresentationTimeStamp(sample))
                                  self.emitProgress(taskId: taskId, progress01: pts / totalDurationSeconds)
                              }
                              if !videoWriterInput.append(sample) {
                                  break
                              }
                          } else {
                              videoWriterInput.markAsFinished()
                              pumpGroup.leave()
                              break
                          }
                      }
                  }

                  if let audioReaderOutput = audioReaderOutput, let audioWriterInput = audioWriterInput {
                      pumpGroup.enter()
                      let audioPumpQueue = DispatchQueue(label: "com.eleaguehub.app.highlight_compression.audio")
                      audioWriterInput.requestMediaDataWhenReady(on: audioPumpQueue) {
                          while audioWriterInput.isReadyForMoreMediaData {
                              if let sample = audioReaderOutput.copyNextSampleBuffer() {
                                  if !audioWriterInput.append(sample) {
                                      break
                                  }
                              } else {
                                  audioWriterInput.markAsFinished()
                                  pumpGroup.leave()
                                  break
                              }
                          }
                      }
                  }

                  pumpGroup.notify(queue: queue) {
                      if reader.status == .failed {
                          writer.cancelWriting()
                          completion(.failure("Reading failed: \(reader.error?.localizedDescription ?? "unknown")"))
                          return
                      }

                      writer.finishWriting {
                          if writer.status == .completed {
                              let attrs = try? FileManager.default.attributesOfItem(atPath: outputPath)
                              let outputBytes = (attrs?[.size] as? NSNumber)?.intValue ?? 0
                              if outputBytes <= 0 {
                                  completion(.failure("Compression produced an empty file."))
                                  return
                              }
                              self.emitProgress(taskId: taskId, progress01: 1.0)
                              completion(.success([
                                  "outputPath": outputPath,
                                  "outputBytes": outputBytes,
                                  "usedMaxHeight": scaledHeight,
                                  "usedVideoBitrateKbps": videoBitrateKbps,
                                  "usedAudioBitrateKbps": audioBitrateKbps,
                              ]))
                          } else {
                              try? FileManager.default.removeItem(at: outputURL)
                              completion(.failure("Writing failed: \(writer.error?.localizedDescription ?? "unknown")"))
                          }
                      }
                  }
              }
          }
          HIGHLIGHT_SWIFT

          echo "✅ Info.plist, entitlements, Podfile, AppDelegate.swift, HighlightCompressionEngine.swift written"

      # ─────────────────────────────────────────
      # 4d. WRITE iOS GoogleService-Info.plist FROM SECRET
      # Required secret: GOOGLESERVICE_INFO_PLIST_B64
      #   (base64 of the file downloaded from Firebase Console →
      #    Add iOS app → bundle ID com.eleaguehub.app)
      # Also substitutes the two placeholders left in Info.plist above:
      #   GOOGLE_REVERSED_CLIENT_ID (parsed straight out of that plist)
      #   IOS_ADMOB_APP_ID (from its own secret — see below)
      # ─────────────────────────────────────────
      - name: Write GoogleService-Info.plist and fill Info.plist placeholders
        env:
          GOOGLESERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_B64 }}
          IOS_ADMOB_APP_ID: ${{ secrets.IOS_ADMOB_APP_ID }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLESERVICE_INFO_PLIST_B64:-}" ]; then
            echo "::error::GOOGLESERVICE_INFO_PLIST_B64 secret is missing. Create an iOS app in Firebase Console (bundle ID com.eleaguehub.app), download GoogleService-Info.plist, base64 it, and store it as this secret."
            exit 1
          fi
          if [ -z "${IOS_ADMOB_APP_ID:-}" ]; then
            echo "::error::IOS_ADMOB_APP_ID secret is missing. Create a separate iOS app entry in the AdMob console (your Android AdMob ID cannot be reused) and store its ca-app-pub-...~... ID as this secret."
            exit 1
          fi

          echo -n "$GOOGLESERVICE_INFO_PLIST_B64" | base64 --decode -o ios/Runner/GoogleService-Info.plist

          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/Runner/GoogleService-Info.plist)

          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleURLSchemes:0 ${REVERSED_CLIENT_ID}" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier ${IOS_ADMOB_APP_ID}" ios/Runner/Info.plist

          echo "✅ GoogleService-Info.plist installed, Info.plist placeholders resolved"

      # ─────────────────────────────────────────
      # 4e. REGISTER GoogleService-Info.plist AS A RUNNER BUNDLE RESOURCE,
      #     REGISTER HighlightCompressionEngine.swift AS A RUNNER COMPILE
      #     SOURCE, AND WIRE Runner.entitlements INTO CODE_SIGN_ENTITLEMENTS
      # The Xcode project is regenerated from scratch every run (step 4b),
      # so it has no idea GoogleService-Info.plist, HighlightCompressionEngine.swift,
      # or Runner.entitlements exist -- normally you'd drag the plist into
      # Xcode once (adding a PBXFileReference + a "Copy Bundle Resources"
      # entry), Xcode would auto-add a new .swift file to Compile Sources
      # the moment you created/dropped it in the project, and adding a
      # capability in Xcode's Signing & Capabilities tab would create the
      # entitlements file AND set CODE_SIGN_ENTITLEMENTS for you. Neither
      # of those manual steps has ever run against this generated project,
      # since it doesn't persist between CI runs.
      #
      # Without the plist wiring, the file sits on disk but is never
      # copied into the shipped .app, so FirebaseApp.configure() in
      # AppDelegate.swift throws immediately on launch with "Could not
      # locate configuration file: 'GoogleService-Info.plist'" -- a native
      # crash before Flutter's UI ever renders (this was already hit and
      # fixed once, confirmed via a real TestFlight crash report).
      #
      # Without the CODE_SIGN_ENTITLEMENTS wiring, Runner.entitlements
      # (Sign in with Apple, associated domains, app groups, aps-
      # environment) sits on disk correctly and the provisioning profile
      # correctly authorizes all of it, but none of it ever gets embedded
      # into the compiled binary's code signature -- so e.g.
      # ASAuthorizationController has no entitlement to check at runtime
      # and fails instantly with a generic error (1000), before it even
      # attempts to present its UI. Confirmed via a real device: Sign in
      # with Apple works in other apps on the same device/network/Apple
      # ID, ruling out everything except this app's own build not
      # actually carrying the entitlement.
      #
      # xcodeproj is already a transitive CocoaPods gem, but install it
      # defensively in case that ever changes.
      # ─────────────────────────────────────────
      - name: Register GoogleService-Info.plist and wire Runner.entitlements
        run: |
          set -euo pipefail
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document

          cat > /tmp/patch_runner_target.rb <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'Runner' }
          raise "Runner target not found in #{project_path}" unless target

          runner_group = project.main_group.find_subpath('Runner', true)

          file_ref = runner_group.children.find { |c| c.respond_to?(:path) && c.path == 'GoogleService-Info.plist' } ||
                     runner_group.new_reference('GoogleService-Info.plist')

          already_included = target.resources_build_phase.files.any? { |bf| bf.file_ref == file_ref }
          target.add_file_references([file_ref]) unless already_included

          # HighlightCompressionEngine.swift: the CI-generated Xcode project
          # has no idea this file exists either (same root cause as
          # GoogleService-Info.plist above) -- without this, the file sits
          # on disk but is never compiled into Runner, so
          # HighlightCompressionEngine.register(...) in AppDelegate.swift
          # fails to resolve at compile time. xcodeproj's add_file_references
          # auto-routes a .swift file to the Compile Sources build phase
          # (unlike the .plist above, which it routes to Copy Bundle
          # Resources) based on the file's type, so the same call pattern
          # works for both -- only the "already included" check needs to
          # look at source_build_phase instead of resources_build_phase.
          swift_file_ref = runner_group.children.find { |c| c.respond_to?(:path) && c.path == 'HighlightCompressionEngine.swift' } ||
                            runner_group.new_reference('HighlightCompressionEngine.swift')
          swift_already_included = target.source_build_phase.files.any? { |bf| bf.file_ref == swift_file_ref }
          target.add_file_references([swift_file_ref]) unless swift_already_included

          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
          end

          project.save
          puts "GoogleService-Info.plist registered in Runner's Copy Bundle Resources"
          puts "HighlightCompressionEngine.swift registered in Runner's Compile Sources"
          puts "CODE_SIGN_ENTITLEMENTS set to Runner/Runner.entitlements on all Runner build configurations"
          RUBY

          ruby /tmp/patch_runner_target.rb
          echo "✅ GoogleService-Info.plist is now a Runner bundle resource"
          echo "✅ HighlightCompressionEngine.swift is now a Runner compile source"
          echo "✅ Runner.entitlements is now wired into CODE_SIGN_ENTITLEMENTS"

      # ─────────────────────────────────────────
      # 5. LAUNCHER ICON (mirrors android.yml step; reuses assets/icon.png)
      # ─────────────────────────────────────────
      - name: Verify launcher icon
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s assets/icon.png ] || ! file assets/icon.png | grep -qE "PNG|image"; then
            echo "::error::assets/icon.png is missing or not a valid image — it must be committed to the repo."
            exit 1
          fi
          file assets/icon.png

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons:main -f ios_launcher_icons_config.yaml || echo "::warning::flutter_launcher_icons step skipped/failed — verify iOS AppIcon.appiconset manually"

      # ─────────────────────────────────────────
      # 6. APPLE CODE SIGNING
      # Uses fastlane match-style manual cert/profile install.
      # Required GitHub Secrets:
      #   IOS_DIST_CERT_P12_B64      - base64 of Apple Distribution .p12
      #   IOS_DIST_CERT_PASSWORD     - password for the .p12
      #   IOS_PROVISION_PROFILE_B64  - base64 of the .mobileprovision
      #   KEYCHAIN_PASSWORD          - any throwaway password for the temp CI keychain
      # ─────────────────────────────────────────
      - name: Install signing certificate & provisioning profile
        env:
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_B64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          for v in IOS_DIST_CERT_P12_B64 IOS_DIST_CERT_PASSWORD IOS_PROVISION_PROFILE_B64 KEYCHAIN_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::${v} secret is missing — cannot sign the build."
              exit 1
            fi
          done

          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"

          echo -n "$IOS_DIST_CERT_P12_B64" | base64 --decode -o "$CERT_PATH"
          echo -n "$IOS_PROVISION_PROFILE_B64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "✅ Certificate and profile installed"

          # ── DIAGNOSTIC: exactly what xcodebuild/flutter build ipa will see ──
          # "No valid code signing certificates were found" has happened on
          # every run so far despite the cert/profile checking out fine when
          # verified locally with openssl. This prints the same identity
          # lookup xcodebuild performs internally, plus the profile's
          # decoded identifiers, so we can see the CI-side truth directly
          # instead of guessing about what got pasted into which secret.
          echo "── security find-identity -p codesigning (this keychain) ──"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          echo ""
          echo "── security find-identity -p codesigning (default search list) ──"
          security find-identity -v -p codesigning || true
          echo ""
          echo "── Provisioning profile identifiers (decoded on this runner) ──"
          security cms -D -i "$PROFILE_PATH" | grep -A2 "TeamIdentifier\|application-identifier\|<key>Name</key>" || true

      # ─────────────────────────────────────────
      # 7. COCOAPODS
      # ─────────────────────────────────────────
      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update
          echo "✅ Pods installed"

      # ─────────────────────────────────────────
      # 8. BUILD IPA
      # Same dart-define set as android.yml (Cloudinary, EH worker, Flutterwave,
      # Supabase) so Dart-side config parity holds across platforms.
      # ─────────────────────────────────────────
      - name: Build Release IPA
        env:
          EH_WORKER_BASE_URL: ${{ secrets.EH_WORKER_BASE_URL }}
          FLW_PUBLIC_KEY_TEST: ${{ secrets.FLW_PUBLIC_KEY_TEST }}
          FLW_PUBLIC_KEY_LIVE: ${{ secrets.FLW_PUBLIC_KEY_LIVE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          IOS_EXPORT_TEAM_ID: ${{ secrets.IOS_EXPORT_TEAM_ID }}
          IOS_PROVISION_PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
        run: |
          set -euo pipefail

          [ -n "${EH_WORKER_BASE_URL:-}" ] || \
            { echo "::error::EH_WORKER_BASE_URL secret is not set"; exit 1; }
          [ -n "${IOS_EXPORT_TEAM_ID:-}" ] || \
            { echo "::error::IOS_EXPORT_TEAM_ID secret is not set (Apple Developer Team ID)"; exit 1; }
          [ -n "${IOS_PROVISION_PROFILE_NAME:-}" ] || \
            { echo "::error::IOS_PROVISION_PROFILE_NAME secret is not set (exact name of the profile, not the file)"; exit 1; }

          DART_DEFINES=""
          DART_DEFINES+=" --dart-define=CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
          DART_DEFINES+=" --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET=${CLOUDINARY_UNSIGNED_UPLOAD_PRESET}"
          DART_DEFINES+=" --dart-define=EH_WORKER_BASE_URL=${EH_WORKER_BASE_URL}"

          if [ -n "${SUPABASE_URL:-}" ]; then
            DART_DEFINES+=" --dart-define=SUPABASE_URL=${SUPABASE_URL}"
          fi
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            DART_DEFINES+=" --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          fi

          if [ -n "${FLW_PUBLIC_KEY_LIVE:-}" ]; then
            DART_DEFINES+=" --dart-define=FLW_PUBLIC_KEY_LIVE=${FLW_PUBLIC_KEY_LIVE}"
            DART_DEFINES+=" --dart-define=FLW_TEST_MODE=false"
          elif [ -n "${FLW_PUBLIC_KEY_TEST:-}" ]; then
            DART_DEFINES+=" --dart-define=FLW_PUBLIC_KEY_TEST=${FLW_PUBLIC_KEY_TEST}"
            DART_DEFINES+=" --dart-define=FLW_TEST_MODE=true"
          fi

          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${IOS_EXPORT_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${IOS_PROVISION_PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # The Xcode project flutter create generates defaults its Release
          # configuration's CODE_SIGN_IDENTITY to "iPhone Developer" (a
          # Development identity type). Our keychain only has the Apple
          # Distribution identity (correct for app-store-connect export),
          # so xcodebuild archive looked for a Development identity, found
          # none, and reported "No valid code signing certificates were
          # found" -- confirmed via --verbose build settings dump showing
          # `CODE_SIGN_IDENTITY = iPhone Developer` despite `security
          # find-identity` proving a valid Distribution identity exists.
          # FLUTTER_XCODE_* env vars are Flutter's supported mechanism for
          # passing xcodebuild build-setting overrides, which take highest
          # precedence over the project file -- this forces the archive
          # step to use manual signing with our actual Distribution
          # identity/team instead of the generated project's default.
          #
          # NOTE: deliberately NOT setting FLUTTER_XCODE_PROVISIONING_
          # PROFILE_SPECIFIER here -- these FLUTTER_XCODE_* overrides apply
          # globally to every target xcodebuild compiles, including all 60+
          # CocoaPods library targets, which correctly reject having any
          # provisioning profile forced on them ("X does not support
          # provisioning profiles") since libraries don't need one.
          export FLUTTER_XCODE_CODE_SIGN_STYLE="Manual"
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY="Apple Distribution"
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="$IOS_EXPORT_TEAM_ID"

          # With CODE_SIGN_STYLE=Manual, Xcode does NOT auto-search
          # installed profiles the way Automatic style does -- manual
          # signing requires an explicit PROVISIONING_PROFILE_SPECIFIER,
          # confirmed by run #62 failing with `"Runner" requires a
          # provisioning profile` even though the correct profile was
          # already installed and the bundle ID now matches it. Since a
          # global FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER breaks
          # every CocoaPods target (see note above), patch it directly
          # into Runner.xcodeproj instead -- scoped only to Runner's own
          # build settings, anchored right after the (already-patched)
          # PRODUCT_BUNDLE_IDENTIFIER line so it only touches Runner's
          # three configs (Debug/Profile/Release), never RunnerTests
          # (whose bundle ID has a distinct ".RunnerTests" suffix) or any
          # Pods target (a separate .xcodeproj file entirely).
          perl -pi -e 's/(PRODUCT_BUNDLE_IDENTIFIER = com\.eleaguehub\.app;)/$1\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "'"${IOS_PROVISION_PROFILE_NAME}"'";/' \
            ios/Runner.xcodeproj/project.pbxproj
          echo "── PROVISIONING_PROFILE_SPECIFIER after patch ──"
          grep "PROVISIONING_PROFILE_SPECIFIER" ios/Runner.xcodeproj/project.pbxproj

          # --build-number overrides pubspec.yaml's static "+85" (which was
          # never bumping, so every CI run produced the same CFBundleVersion
          # and App Store Connect rejected the re-upload with "bundle version
          # must be higher than the previously uploaded version: 85").
          # github.run_number only ever increases for this workflow file
          # (already at 166, well past 85 -- no gap or collision), so each
          # build now gets a build number Apple has never seen before,
          # without touching pubspec.yaml's human-facing version at all.
          flutter build ipa \
            --release \
            --no-tree-shake-icons \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist \
            ${DART_DEFINES}

          echo "✅ IPA built successfully"

      - name: Verify IPA
        run: |
          set -euo pipefail
          IPA_DIR="build/ios/ipa"
          IPA_FILE=$(find "$IPA_DIR" -name "*.ipa" | head -n 1)
          [ -n "$IPA_FILE" ] || { echo "::error::No IPA produced"; exit 1; }
          echo "✅ IPA: $IPA_FILE ($(du -h "$IPA_FILE" | cut -f1))"

      # ─────────────────────────────────────────
      # 9. UPLOAD ARTIFACT
      # ─────────────────────────────────────────
      - name: Upload Release IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # ─────────────────────────────────────────
      # 10. OPTIONAL: UPLOAD TO APP STORE CONNECT (TestFlight)
      # Only runs if all three App Store Connect API secrets are present.
      # Required GitHub Secrets:
      #   ASC_API_KEY_ID       - Key ID from App Store Connect > Users and Access > Keys
      #   ASC_API_ISSUER_ID    - Issuer ID, same page
      #   ASC_API_KEY_P8_B64   - base64 of the downloaded .p8 private key
      #
      # NOTE: these three are already pulled into job-level `env:` above.
      # The `secrets` context is NOT allowed directly inside a step `if:`
      # condition — GitHub rejects the workflow file at parse time with
      # "Unrecognized named-value: 'secrets'" if you try. Routing them
      # through job-level env and checking `env.*` here is the fix.
      # ─────────────────────────────────────────
      - name: Upload to App Store Connect
        if: ${{ env.ASC_API_KEY_ID != '' && env.ASC_API_ISSUER_ID != '' && env.ASC_API_KEY_P8_B64 != '' }}
        run: |
          set -euo pipefail

          # ── DIAGNOSTIC: altool failed on run #69 with a generic
          # "Failure to authenticate" (-26000), which gives no hint
          # whether the cause is a malformed/mis-pasted secret (stray
          # whitespace/newline, wrong file entirely) vs a genuinely
          # wrong/revoked Key ID or Issuer ID. Trim whitespace
          # defensively (a trailing newline from how a secret was
          # pasted is a common cause of this exact error) and print
          # non-secret structural facts -- lengths and the PEM
          # header -- so we can tell those cases apart without ever
          # printing the actual credential values.
          KEY_ID_TRIMMED="$(printf '%s' "$ASC_API_KEY_ID" | tr -d '[:space:]')"
          ISSUER_ID_TRIMMED="$(printf '%s' "$ASC_API_ISSUER_ID" | tr -d '[:space:]')"

          mkdir -p ~/private_keys
          printf '%s' "$ASC_API_KEY_P8_B64" | tr -d '[:space:]' | base64 --decode -o ~/private_keys/AuthKey_${KEY_ID_TRIMMED}.p8

          echo "── ASC credential diagnostics (no secret values printed) ──"
          echo "ASC_API_KEY_ID length: ${#ASC_API_KEY_ID} (trimmed: ${#KEY_ID_TRIMMED}, expected 10)"
          echo "ASC_API_ISSUER_ID length: ${#ASC_API_ISSUER_ID} (trimmed: ${#ISSUER_ID_TRIMMED}, expected 36, UUID format)"
          echo "Decoded .p8 file size: $(wc -c < ~/private_keys/AuthKey_${KEY_ID_TRIMMED}.p8) bytes"
          echo "Decoded .p8 first line: $(head -n1 ~/private_keys/AuthKey_${KEY_ID_TRIMMED}.p8)"
          echo "Decoded .p8 line count: $(wc -l < ~/private_keys/AuthKey_${KEY_ID_TRIMMED}.p8)"

          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$KEY_ID_TRIMMED" \
            --apiIssuer "$ISSUER_ID_TRIMMED" \
            --verbose

          echo "✅ Uploaded to App Store Connect / TestFlight"

      - name: Skipped App Store Connect upload
        if: ${{ env.ASC_API_KEY_ID == '' || env.ASC_API_ISSUER_ID == '' || env.ASC_API_KEY_P8_B64 == '' }}
        run: |
          echo "::notice::ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8_B64 not fully set — IPA was built and uploaded as a workflow artifact only, not sent to App Store Connect."

      # ─────────────────────────────────────────
      # 11. SUMMARY
      # ─────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "============================================"
          echo "✅ iOS BUILD COMPLETE"
          echo "============================================"
          find build/ios/ipa -name "*.ipa" -exec ls -lh {} \;
          echo ""
          echo "Download from: Actions → this workflow run → Artifacts → app-release-ipa"
          echo "============================================"
