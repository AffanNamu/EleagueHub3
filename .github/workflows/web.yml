name: Flutter Web Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    env:
      FLUTTER_CHANNEL: stable
      FLUTTER_VERSION: 3.24.5
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

      # Helps reduce DNS/IPv6 flakiness on some runners
      NODE_OPTIONS: --dns-result-order=ipv4first
      # Larger thread pool for DNS/network I/O
      UV_THREADPOOL_SIZE: 128

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare pub cache
        run: mkdir -p "${PUB_CACHE}"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-web-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-web-${{ runner.os }}-

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web with HTML Renderer
        env:
          EH_WORKER_BASE_URL: ${{ secrets.EH_WORKER_BASE_URL }}
          FLW_PUBLIC_KEY_TEST: ${{ secrets.FLW_PUBLIC_KEY_TEST }}
          FLW_PUBLIC_KEY_LIVE: ${{ secrets.FLW_PUBLIC_KEY_LIVE }}
        run: |
          set -euo pipefail

          DART_DEFINES=""
          DART_DEFINES="${DART_DEFINES} --dart-define=CLOUDINARY_CLOUD_NAME=dbw9zpkxi"
          DART_DEFINES="${DART_DEFINES} --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET=eSportlyic_unsigned"

          if [ -n "${EH_WORKER_BASE_URL:-}" ]; then
            DART_DEFINES="${DART_DEFINES} --dart-define=EH_WORKER_BASE_URL=${EH_WORKER_BASE_URL}"
          fi

          if [ -n "${FLW_PUBLIC_KEY_LIVE:-}" ]; then
            DART_DEFINES="${DART_DEFINES} --dart-define=FLW_PUBLIC_KEY_LIVE=${FLW_PUBLIC_KEY_LIVE}"
            DART_DEFINES="${DART_DEFINES} --dart-define=FLW_TEST_MODE=false"
          elif [ -n "${FLW_PUBLIC_KEY_TEST:-}" ]; then
            DART_DEFINES="${DART_DEFINES} --dart-define=FLW_PUBLIC_KEY_TEST=${FLW_PUBLIC_KEY_TEST}"
            DART_DEFINES="${DART_DEFINES} --dart-define=FLW_TEST_MODE=true"
          fi

          flutter build web --release --web-renderer html ${DART_DEFINES}

      - name: Verify web output
        run: |
          set -euo pipefail
          test -d build/web
          ls -la build/web

      # ──────────────────────────────────────────────────────────────────
      # Node 20 LTS — Node 22 causes "Premature close" errors with
      # gaxios / google-auth-library on GitHub-hosted runners.
      # ──────────────────────────────────────────────────────────────────
      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node version
        run: node -v && npm -v

      - name: Install Firebase CLI
        run: npm i -g firebase-tools@15.21.0

      # ──────────────────────────────────────────────────────────────────
      # Validate the service-account JSON (never print private_key).
      # ──────────────────────────────────────────────────────────────────
      - name: Validate FIREBASE_SERVICE_ACCOUNT secret (safe)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "Secret length: ${#SA_JSON}"
          echo "$SA_JSON" | jq '{project_id, client_email, private_key_present: (.private_key | length > 0)}'

      # ──────────────────────────────────────────────────────────────────
      # Obtain a Google OAuth2 access token using curl + openssl.
      #
      # This COMPLETELY BYPASSES the Node.js google-auth-library HTTP
      # stack, avoiding the "Premature close" network errors caused by
      # Node 22 + gaxios on GitHub runners.
      #
      # The resulting token is exported as FIREBASE_TOKEN, which the
      # Firebase CLI reads directly — no JWT↔token exchange inside Node.
      # ──────────────────────────────────────────────────────────────────
      - name: Obtain Firebase access token via curl
        id: firebase-auth
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          CLIENT_EMAIL="$(echo "$SA_JSON" | jq -r '.client_email')"
          TOKEN_URI="$(echo "$SA_JSON" | jq -r '.token_uri // "https://oauth2.googleapis.com/token"')"

          # Write private key to a temp file for openssl signing
          KEY_FILE="$(mktemp /tmp/sa-key.XXXXXX.pem)"
          echo "$SA_JSON" | jq -r '.private_key' > "$KEY_FILE"

          # ── Helper: base64url encoding (no padding) ──
          b64url() { base64 -w0 | tr '+/' '-_' | tr -d '='; }

          # ── Build JWT header & payload ──
          HEADER="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"

          NOW="$(date +%s)"
          EXP="$((NOW + 3600))"
          PAYLOAD="$(printf '{"iss":"%s","scope":"email openid https://www.googleapis.com/auth/cloudplatformprojects.readonly https://www.googleapis.com/auth/firebase https://www.googleapis.com/auth/cloud-platform","aud":"%s","exp":%d,"iat":%d}' \
            "$CLIENT_EMAIL" "$TOKEN_URI" "$EXP" "$NOW" | b64url)"

          # ── Sign the JWT with the service account private key ──
          SIGNATURE="$(printf '%s' "${HEADER}.${PAYLOAD}" \
            | openssl dgst -binary -sha256 -sign "$KEY_FILE" \
            | b64url)"

          rm -f "$KEY_FILE"

          JWT="${HEADER}.${PAYLOAD}.${SIGNATURE}"

          # ── Exchange JWT for access token (with retries) ──
          for i in 1 2 3; do
            RESPONSE="$(curl -sS --http1.1 --max-time 30 --retry 2 \
              -X POST "${TOKEN_URI}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${JWT}")"

            ACCESS_TOKEN="$(echo "$RESPONSE" | jq -r '.access_token // empty')"
            if [ -n "$ACCESS_TOKEN" ]; then
              echo "Access token obtained successfully (length: ${#ACCESS_TOKEN})"
              # Register as FIREBASE_TOKEN so firebase CLI uses it directly
              echo "FIREBASE_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"
              # Mask the token in subsequent logs
              echo "::add-mask::${ACCESS_TOKEN}"
              exit 0
            fi

            echo "Attempt $i failed. Server response:"
            echo "$RESPONSE" | jq '.' 2>/dev/null || echo "$RESPONSE"
            sleep 5
          done

          echo "ERROR: Could not obtain access token after 3 attempts."
          exit 1

      - name: Firebase projects:list (verify auth)
        run: |
          set -euo pipefail
          firebase --version

          for i in 1 2 3; do
            echo "projects:list attempt $i..."
            if firebase projects:list; then
              exit 0
            fi
            sleep 5
          done

          echo "projects:list failed after retries."
          exit 1

      - name: Deploy to Firebase Hosting (retry + debug)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Deploy attempt $i..."
            if firebase deploy --only hosting --project esportlyic --non-interactive --debug; then
              echo "Deploy succeeded."
              exit 0
            fi
            echo "Deploy failed. Sleeping before retry..."
            sleep $((i*10))
          done
          echo "Deploy failed after retries."
          exit 1
