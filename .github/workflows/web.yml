name: Flutter Web Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    env:
      FLUTTER_CHANNEL: stable
      FLUTTER_VERSION: 3.24.5
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

      # Helps reduce DNS/IPv6 flakiness on some runners
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare pub cache
        run: mkdir -p "${PUB_CACHE}"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-web-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-web-${{ runner.os }}-

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web with HTML Renderer
        env:
          EH_WORKER_BASE_URL: ${{ secrets.EH_WORKER_BASE_URL }}
          FLW_PUBLIC_KEY_TEST: ${{ secrets.FLW_PUBLIC_KEY_TEST }}
          FLW_PUBLIC_KEY_LIVE: ${{ secrets.FLW_PUBLIC_KEY_LIVE }}
        run: |
          set -euo pipefail

          DART_DEFINES=""
          DART_DEFINES="${DART_DEFINES} --dart-define=CLOUDINARY_CLOUD_NAME=dbw9zpkxi"
          DART_DEFINES="${DART_DEFINES} --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET=eSportlyic_unsigned"

          if [ -n "${EH_WORKER_BASE_URL:-}" ]; then
            DART_DEFINES="${DART_DEFINES} --dart-define=EH_WORKER_BASE_URL=${EH_WORKER_BASE_URL}"
          fi

          if [ -n "${FLW_PUBLIC_KEY_LIVE:-}" ]; then
            DART_DEFINES="${DART_DEFINES} --dart-define=FLW_PUBLIC_KEY_LIVE=${FLW_PUBLIC_KEY_LIVE}"
            DART_DEFINES="${DART_DEFINES} --dart-define=FLW_TEST_MODE=false"
          elif [ -n "${FLW_PUBLIC_KEY_TEST:-}" ]; then
            DART_DEFINES="${DART_DEFINES} --dart-define=FLW_PUBLIC_KEY_TEST=${FLW_PUBLIC_KEY_TEST}"
            DART_DEFINES="${DART_DEFINES} --dart-define=FLW_TEST_MODE=true"
          fi

          flutter build web --release --web-renderer html ${DART_DEFINES}

      - name: Verify web output
        run: |
          set -euo pipefail
          test -d build/web
          ls -la build/web

      - name: Set up Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node version
        run: node -v && npm -v

      - name: Install Firebase CLI (pinned)
        run: npm i -g firebase-tools@15.21.0

      # Workaround: patch gtoken token URL away from www.googleapis.com/oauth2/v4/token
      - name: Patch OAuth token endpoint (gtoken workaround)
        run: |
          set -euo pipefail

          GLOBAL="$(npm root -g)"
          echo "Global node_modules: $GLOBAL"

          TARGET_DIR="$GLOBAL/firebase-tools/node_modules/gtoken"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "gtoken not found at: $TARGET_DIR"
            echo "Listing firebase-tools node_modules:"
            ls -la "$GLOBAL/firebase-tools/node_modules" || true
            exit 1
          fi

          echo "Searching for legacy token endpoint..."
          MATCHES="$(grep -R "https://www.googleapis.com/oauth2/v4/token" -n "$TARGET_DIR" || true)"
          echo "$MATCHES" || true

          if [ -n "$MATCHES" ]; then
            FILES="$(echo "$MATCHES" | cut -d: -f1 | sort -u)"
            echo "Patching files:"
            echo "$FILES"

            for f in $FILES; do
              # Try without sudo first, then sudo if needed.
              sed -i 's#https://www.googleapis.com/oauth2/v4/token#https://oauth2.googleapis.com/token#g' "$f" 2>/dev/null \
                || sudo sed -i 's#https://www.googleapis.com/oauth2/v4/token#https://oauth2.googleapis.com/token#g' "$f"
            done
          fi

          echo "Confirm patched endpoint exists (sample):"
          grep -R "oauth2.googleapis.com/token" -n "$TARGET_DIR" | head -n 20 || true

      # Safe validation that secret exists and parses (does not print private_key)
      - name: Validate FIREBASE_SERVICE_ACCOUNT secret (safe)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "Secret length: ${#SA_JSON}"
          node -e "const sa=JSON.parse(process.env.SA_JSON); console.log('project_id=', sa.project_id); console.log('client_email=', sa.client_email); console.log('private_key_present=', !!sa.private_key);"

      - name: Write service account file
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/firebase-sa.json"
          printf '%s' "$SA_JSON" > "$KEY_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_PATH" >> $GITHUB_ENV
          ls -la "$KEY_PATH"

      - name: Firebase auth debug (projects:list) with retry
        run: |
          set -euo pipefail
          firebase --version

          for i in 1 2 3 4 5; do
            echo "projects:list attempt $i..."
            if firebase projects:list --debug; then
              exit 0
            fi
            sleep $((i*8))
          done

          echo "projects:list failed after retries."
          exit 1

      - name: Deploy to Firebase Hosting (retry + debug)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Deploy attempt $i..."
            if firebase deploy --only hosting --project esportlyic --non-interactive --debug; then
              echo "Deploy succeeded."
              exit 0
            fi
            echo "Deploy failed. Sleeping before retry..."
            sleep $((i*10))
          done
          echo "Deploy failed after retries."
          exit 1
