name: Backfill Search Name

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backfill-scripts
        run: npm install

      - name: Write service account key
        working-directory: backfill-scripts
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKFILL }}
        run: echo "$SERVICE_ACCOUNT_JSON" > serviceAccountKey.json

      - name: Run backfill
        working-directory: backfill-scripts
        run: node backfill.js
