name: Deploy Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy_worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          secrets: |
            LIVEKIT_API_KEY
            LIVEKIT_API_SECRET
            FIREBASE_CLIENT_EMAIL
            FIREBASE_PRIVATE_KEY
            FLUTTERWAVE_SECRET_KEY
            CLOUDINARY_API_KEY
            CLOUDINARY_API_SECRET
            API_FOOTBALL_KEY
            NEWS_API_KEY
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FLUTTERWAVE_SECRET_KEY: ${{ secrets.FLUTTERWAVE_SECRET_KEY }}
          # Cloudinary account credentials, for signing highlight video
          # uploads server-side (/cloudinary/sign-highlight). The API key
          # itself isn't secret per Cloudinary's own docs, but the API
          # SECRET must never reach the client -- both live here as
          # GitHub secrets regardless, out of caution.
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # APPLE_SHARED_SECRET intentionally NOT listed here for now.
          # wrangler-action aborts the ENTIRE deploy the instant any listed
          # secret has no value in env -- with the GitHub secret unset,
          # leaving this wired was blocking every other deploy (Football
          # Hub included), not just Apple purchase verification. Apple
          # purchase-activation calls already fail gracefully today
          # (_requireEnvString("APPLE_SHARED_SECRET") throws only when that
          # code path is actually hit) -- no regression from removing this.
          # Once App Store Connect -> app -> Subscriptions -> App-Specific
          # Shared Secret is set up for real, add the GitHub secret AND
          # restore both the `secrets:` list entry above and this env line.
          # Football Hub data sources. Both keys are proxied server-side
          # only (never shipped in the Flutter client) -- these free-tier
          # keys have a hard daily request cap (API-Football: 100/day) and
          # most providers' free-tier terms forbid embedding the key in a
          # distributed app binary, since it can be extracted and abused.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Test worker endpoints
        working-directory: .
        run: |
          set -euo pipefail

          WORKER_URL="https://livekit-token-worker.esportlyic.workers.dev"
          echo "Testing worker at: ${WORKER_URL}"
          echo ""

          # Wait for deployment to propagate
          sleep 5

          # Test /organizer-pro/activate
          echo "=== Testing /organizer-pro/activate ==="
          HTTP_CODE=$(curl -s -o /tmp/resp1.txt -w "%{http_code}" \
            -X POST "${WORKER_URL}/organizer-pro/activate" \
            -H "Content-Type: application/json" \
            -d '{"plan":"basic","provider":"flutterwave","receiptId":"test"}' \
            --max-time 15)
          RESP=$(cat /tmp/resp1.txt)
          echo "HTTP ${HTTP_CODE}: ${RESP}"

          if [ "${HTTP_CODE}" = "401" ]; then
            echo "✅ /organizer-pro/activate works (401 = needs auth, correct)"
          elif echo "${RESP}" | grep -qi "FIREBASE_PROJECT_ID"; then
            echo "::error::Still missing FIREBASE_PROJECT_ID — check wrangler.toml [vars]"
            exit 1
          elif echo "${RESP}" | grep -qi "FIREBASE_CLIENT_EMAIL"; then
            echo "::error::Missing FIREBASE_CLIENT_EMAIL secret in Cloudflare dashboard"
            echo "Go to: https://dash.cloudflare.com → Workers → livekit-token-worker → Settings → Variables"
            exit 1
          elif echo "${RESP}" | grep -qi "FIREBASE_PRIVATE_KEY"; then
            echo "::error::Missing FIREBASE_PRIVATE_KEY secret in Cloudflare dashboard"
            exit 1
          elif echo "${RESP}" | grep -qi "FLUTTERWAVE_SECRET_KEY"; then
            echo "::error::Missing FLUTTERWAVE_SECRET_KEY secret in Cloudflare dashboard"
            exit 1
          elif [ "${HTTP_CODE}" = "404" ]; then
            echo "::error::Endpoint not found — worker code outdated"
            exit 1
          else
            echo "::warning::Unexpected response — check Cloudflare worker logs"
          fi

          echo ""

          # Test /premium/activate
          echo "=== Testing /premium/activate ==="
          HTTP_CODE2=$(curl -s -o /tmp/resp2.txt -w "%{http_code}" \
            -X POST "${WORKER_URL}/premium/activate" \
            -H "Content-Type: application/json" \
            -d '{"provider":"flutterwave","receiptId":"test"}' \
            --max-time 15)
          RESP2=$(cat /tmp/resp2.txt)
          echo "HTTP ${HTTP_CODE2}: ${RESP2}"

          if [ "${HTTP_CODE2}" = "401" ]; then
            echo "✅ /premium/activate works (401 = needs auth, correct)"
          elif [ "${HTTP_CODE2}" = "404" ]; then
            echo "::warning::/premium/activate not found — check worker/src/index.js has the endpoint"
          fi

          echo ""
          echo "=========================================="
          echo "  /organizer-pro/activate : HTTP ${HTTP_CODE}"
          echo "  /premium/activate       : HTTP ${HTTP_CODE2}"
          echo "=========================================="
