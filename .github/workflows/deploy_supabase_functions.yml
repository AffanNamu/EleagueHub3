name: Deploy Supabase Edge Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy_supabase_functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Project ref must match supabase/config.toml's project_id.
      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref rswbkehnqhznwhbbcvvp

      # Deploy every function directory under supabase/functions/ (loop
      # instead of a hardcoded list, so a newly added function gets
      # deployed automatically without this workflow needing an edit).
      # Each deploy is a full replace of that function's code and is a
      # no-op if unchanged, so redeploying all of them on every push here
      # is cheap and keeps them from drifting out of sync with the repo.
      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            echo "── Deploying $fn ──"
            supabase functions deploy "$fn"
          done
