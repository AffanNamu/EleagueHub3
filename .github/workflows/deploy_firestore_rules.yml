name: Deploy Firestore Rules

on:
  push:
    branches: [ main ]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/deploy_firestore_rules.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuses the same FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY secrets
      # already used by worker/src/index.js for its own Firebase Admin
      # access, rather than requiring a separate key. That worker mints its
      # own OAuth access tokens with a narrow, hand-picked scope list
      # (identitytoolkit/datastore/androidpublisher) for its own requests —
      # unrelated here, since firebase-tools requests whatever scopes it
      # needs itself via Application Default Credentials. All that matters
      # is the underlying service account's IAM role includes rules-deploy
      # permission, true by default for the standard Firebase Admin SDK
      # service account (Editor role) generated from Firebase Console.
      # Mirrors worker/src/index.js's _serviceAccountPrivateKeyPem(): the
      # secret may store the PEM with literal "\n" escapes instead of real
      # newlines, so unescape defensively before embedding it in JSON.
      - name: Write service account key
        env:
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          PRIVATE_KEY=$(printf '%s' "$FIREBASE_PRIVATE_KEY" | sed 's/\\n/\n/g')
          jq -n \
            --arg type "service_account" \
            --arg project_id "esportlyic" \
            --arg client_email "$FIREBASE_CLIENT_EMAIL" \
            --arg private_key "$PRIVATE_KEY" \
            '{type: $type, project_id: $project_id, client_email: $client_email, private_key: $private_key}' \
            > "${{ runner.temp }}/firebase-sa.json"

      # Split into two steps, deliberately NOT combined as
      # `--only firestore:rules,firestore:indexes` in one call. The rules
      # deploy has succeeded on every run to date; the indexes deploy has
      # been separately failing with a 403 ("The caller does not have
      # permission") on collectionGroups/highlights/indexes -- an IAM gap
      # on the service account (FIREBASE_CLIENT_EMAIL), not a rules
      # problem and not fixed by adding the index manually through the
      # Firebase console (confirmed: the same 403 recurred after doing
      # so). Combined into one `firebase deploy` call, that unrelated
      # indexes failure aborted the whole command and made this workflow
      # report red even though the rules -- the part that actually
      # matters for app behavior -- had already deployed successfully.
      # Splitting means a rules-only regression still fails this job
      # loudly, while the known indexes/IAM issue is visible (step 2
      # shows failed) without blocking or masking that.
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:rules \
            --project esportlyic \
            --non-interactive

      - name: Deploy Firestore indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        continue-on-error: true
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:indexes \
            --project esportlyic \
            --non-interactive

      - name: Clean up credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-sa.json"
