name: Android CI (Release APK - Production)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDINARY_CLOUD_NAME: dbw9zpkxi
      CLOUDINARY_UNSIGNED_UPLOAD_PRESET: eSportlyic_unsigned
      ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Resolve Flutter SDK path (FLUTTER_ROOT)
        run: |
          FLUTTER_BIN="$(which flutter)"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"

      - name: Write android/local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "flutter.sdk=${FLUTTER_ROOT}" > android/local.properties
          echo "sdk.dir=${SDK_DIR}" >> android/local.properties

      - name: Restore stable debug keystore
        if: ${{ env.ANDROID_DEBUG_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          python3 - <<'PY'
          import os, base64, pathlib
          b64 = os.environ.get("ANDROID_DEBUG_KEYSTORE_B64", "").strip().replace("\n","").replace("\r","")
          b64 += "=" * ((4 - (len(b64) % 4)) % 4)
          data = base64.b64decode(b64, validate=False)
          out = pathlib.Path.home() / ".android" / "debug.keystore"
          out.write_bytes(data)
          PY

      - name: Verify keystore is valid
        run: |
          echo "Keystore size: $(wc -c < ~/.android/debug.keystore) bytes"
          keytool -list -v \
            -alias androiddebugkey \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android | grep -E "SHA1:|SHA-1:" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean old launcher icons
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          rm -f android/app/src/main/res/drawable/ic_launcher*
          rm -rf android/app/src/main/res/drawable-anydpi*
          find android/app/src/main/res/ -type f -name "*launcher*" -delete

      - name: Download new launcher icon
        run: |
          mkdir -p assets
          curl -L -o assets/icon.png "https://drive.google.com/uc?export=download&id=1tsB5ZVBNWke_wlrCuKiOiXMrGSPEqZZd"

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Build RELEASE APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=CLOUDINARY_CLOUD_NAME="${CLOUDINARY_CLOUD_NAME}" \
            --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET="${CLOUDINARY_UNSIGNED_UPLOAD_PRESET}"

      - name: Verify APK is signed
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          echo "APK size: $(wc -c < "$APK") bytes"
          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools/ | tail -1)/apksigner verify --print-certs "$APK" || echo "WARNING: APK signature verification failed"

      - name: Show build outputs
        run: |
          ls -la build/app/outputs/flutter-apk || true

      - name: Upload RELEASE APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
