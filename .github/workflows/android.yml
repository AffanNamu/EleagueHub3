name: Android CI (Release APK + AAB - Production)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CLOUDINARY_CLOUD_NAME: dbw9zpkxi
      CLOUDINARY_UNSIGNED_UPLOAD_PRESET: eSportlyic_unsigned
      FLUTTER_CHANNEL: stable
      FLUTTER_VERSION: 3.24.5
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      ICON_FILE_ID: "1QBBUJQHovaW-60aomg68B4YLO7OzZVSN"

    steps:
      # ─────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────
      - name: Checkout (with retries)
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          ok=0
          for i in 1 2 3 4 5 6; do
            echo "Checkout attempt ${i}/6..."
            find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} + || true
            rm -rf .git || true
            git init -q
            git config gc.auto 0
            git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
            if git -c protocol.version=2 fetch \
                --no-tags --prune --no-recurse-submodules \
                --depth=1 origin "${SHA}"; then
              git checkout --detach -q FETCH_HEAD
              echo "✅ Checked out: $(git rev-parse HEAD)"
              ok=1
              break
            fi
            sleep $((i * 15))
          done
          [ "${ok}" -eq 1 ] || { echo "ERROR: Checkout failed"; exit 1; }

      # ─────────────────────────────────────────
      # 2. PREPARE DIRECTORIES
      # ─────────────────────────────────────────
      - name: Prepare directories
        run: |
          mkdir -p "${PUB_CACHE}"
          mkdir -p "${GRADLE_USER_HOME}"
          mkdir -p "${{ runner.temp }}/flutter"

      # ─────────────────────────────────────────
      # 3. JAVA
      # ─────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─────────────────────────────────────────
      # 4. CACHES
      # ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties','**/*.gradle*','**/settings.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Flutter SDK
        id: cache-flutter
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # ─────────────────────────────────────────
      # 5. SYSTEM DEPS
      # ─────────────────────────────────────────
      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xz-utils unzip curl git libglu1-mesa imagemagick file python3
          sudo apt-get clean

      # ─────────────────────────────────────────
      # 6. FLUTTER
      # ─────────────────────────────────────────
      - name: Download Flutter SDK
        if: steps.cache-flutter.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TARBALL="flutter_linux_${FLUTTER_VERSION}-${FLUTTER_CHANNEL}.tar.xz"
          URL="https://storage.googleapis.com/flutter_infra_release/releases/${FLUTTER_CHANNEL}/linux/${TARBALL}"
          cd "${{ runner.temp }}"
          curl -L --fail --retry 8 --retry-delay 5 --retry-all-errors \
            -o "${TARBALL}" "${URL}"
          tar -xJf "${TARBALL}" -C flutter/

      - name: Add Flutter to PATH
        run: |
          echo "${{ runner.temp }}/flutter/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=${{ runner.temp }}/flutter/flutter" >> "$GITHUB_ENV"

      - name: Flutter doctor
        run: |
          flutter --version
          flutter config --no-analytics
          flutter doctor -v

      # ─────────────────────────────────────────
      # 7. LOCAL PROPERTIES
      # ─────────────────────────────────────────
      - name: Write android/local.properties
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "${SDK_DIR}" ] || { echo "ERROR: No Android SDK"; exit 1; }
          echo "flutter.sdk=${FLUTTER_ROOT}" > android/local.properties
          echo "sdk.dir=${SDK_DIR}"          >> android/local.properties
          echo "flutter.versionCode=21"      >> android/local.properties
          echo "flutter.versionName=1.0.0"   >> android/local.properties

      # ─────────────────────────────────────────
      # 8. RELEASE KEYSTORE
      # ─────────────────────────────────────────
      - name: Restore Release Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p android/app/keystore

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::KEYSTORE_B64 secret is missing!"
            exit 1
          fi

          python3 - <<'PY'
          import os, base64, pathlib
          b64 = os.environ["KEYSTORE_B64"].strip() \
                  .replace("\n","").replace("\r","")
          b64 += "=" * ((4 - len(b64) % 4) % 4)
          data = base64.b64decode(b64, validate=False)
          out = pathlib.Path("android/app/keystore/release.keystore")
          out.write_bytes(data)
          print(f"✅ Wrote {len(data)} bytes → {out}")
          PY

          echo "KEYSTORE_PATH=$(pwd)/android/app/keystore/release.keystore" \
            >> "$GITHUB_ENV"

      - name: Verify Release Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "Keystore size: $(wc -c < "${KEYSTORE_PATH}") bytes"
          keytool -list \
            -keystore "${KEYSTORE_PATH}" \
            -alias "${KEY_ALIAS}" \
            -storepass "${STORE_PASSWORD}" | grep -E "fingerprint|Entry type:" || true
          echo "✅ Keystore is valid"

      # ─────────────────────────────────────────
      # 9. PUB GET
      # ─────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ─────────────────────────────────────────
      # 10. LAUNCHER ICON
      # ─────────────────────────────────────────
      - name: Clean old launcher icons
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          rm -f  android/app/src/main/res/drawable/ic_launcher*
          rm -rf android/app/src/main/res/drawable-anydpi*
          find android/app/src/main/res/ -type f -name "*launcher*" -delete

      - name: Download launcher icon from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          FILE_ID="${ICON_FILE_ID}"
          ICON_PATH="assets/icon.png"
          COOKIE_JAR="/tmp/gdrive_cookies.txt"
          ICON_OK=0

          echo "================================================"
          echo "Downloading icon: File ID = ${FILE_ID}"
          echo "================================================"

          # ── Attempt 1: Simple direct download ──
          echo ""
          echo "🔄 Attempt 1: Simple direct download..."
          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            --max-time 60 \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
            -o "${ICON_PATH}" || true

          if file "${ICON_PATH}" 2>/dev/null | grep -q "PNG"; then
            echo "✅ Attempt 1 succeeded"
            ICON_OK=1
          else
            echo "⚠️ Attempt 1 failed — not a PNG"
            rm -f "${ICON_PATH}"
          fi

          # ── Attempt 2: With cookie jar (handles large file confirmation) ──
          if [ "${ICON_OK}" -eq 0 ]; then
            echo ""
            echo "🔄 Attempt 2: With cookie jar..."
            rm -f "${COOKIE_JAR}"

            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              --max-time 60 \
              --cookie-jar "${COOKIE_JAR}" \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
              -o "${ICON_PATH}" || true

            if file "${ICON_PATH}" 2>/dev/null | grep -q "PNG"; then
              echo "✅ Attempt 2 succeeded"
              ICON_OK=1
            else
              echo "⚠️ Attempt 2 failed — extracting confirm token..."
              rm -f "${ICON_PATH}"

              # Extract confirm token from response
              CONFIRM=$(grep -o 'confirm=[^&"]*' /tmp/gdrive_attempt2.html 2>/dev/null \
                | head -1 | cut -d= -f2 || echo "")

              if [ -z "${CONFIRM}" ]; then
                CONFIRM="t"
              fi

              echo "   Using confirm token: ${CONFIRM}"

              curl -fsSL \
                --retry 3 \
                --retry-delay 2 \
                --max-time 60 \
                --cookie-jar "${COOKIE_JAR}" \
                --cookie "${COOKIE_JAR}" \
                "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" \
                -o "${ICON_PATH}" || true

              if file "${ICON_PATH}" 2>/dev/null | grep -q "PNG"; then
                echo "✅ Attempt 2 with confirm token succeeded"
                ICON_OK=1
              else
                echo "⚠️ Attempt 2 with confirm token failed"
                rm -f "${ICON_PATH}"
              fi
            fi
          fi

          # ── Attempt 3: Python gdown-style download ──
          if [ "${ICON_OK}" -eq 0 ]; then
            echo ""
            echo "🔄 Attempt 3: Python smart download..."
            python3 - <<PYEOF
          import urllib.request
          import urllib.parse
          import http.cookiejar
          import re
          import sys
          import os

          file_id = "${FILE_ID}"
          output  = "${ICON_PATH}"

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          opener.addheaders = [
              ("User-Agent",
               "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
               "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"),
          ]

          url1 = f"https://drive.google.com/uc?export=download&id={file_id}"
          print(f"  Fetching: {url1}")

          try:
              resp1 = opener.open(url1, timeout=60)
              body  = resp1.read()

              # If it's already a PNG, save it
              if body[:8] == b"\x89PNG\r\n\x1a\n":
                  with open(output, "wb") as f:
                      f.write(body)
                  print(f"  ✅ Downloaded PNG directly ({len(body)} bytes)")
                  sys.exit(0)

              # Look for confirm token in HTML
              text    = body.decode("utf-8", errors="replace")
              confirm = ""

              for pattern in [
                  r'confirm=([0-9A-Za-z_\-]+)',
                  r'"confirm":"([^"]+)"',
                  r'name="confirm"\s+value="([^"]+)"',
              ]:
                  m = re.search(pattern, text)
                  if m:
                      confirm = m.group(1)
                      break

              if not confirm:
                  confirm = "t"

              print(f"  Confirm token: {confirm}")

              url2 = (
                  f"https://drive.google.com/uc?export=download"
                  f"&confirm={confirm}&id={file_id}"
              )
              print(f"  Fetching confirmed URL...")
              resp2 = opener.open(url2, timeout=60)
              data  = resp2.read()

              if data[:8] == b"\x89PNG\r\n\x1a\n":
                  with open(output, "wb") as f:
                      f.write(data)
                  print(f"  ✅ Downloaded PNG with confirm ({len(data)} bytes)")
                  sys.exit(0)
              else:
                  print(f"  ❌ Response is not PNG (first 16 bytes: {data[:16].hex()})")
                  sys.exit(1)

          except Exception as e:
              print(f"  ❌ Error: {e}")
              sys.exit(1)
          PYEOF

            if [ $? -eq 0 ] && file "${ICON_PATH}" 2>/dev/null | grep -q "PNG"; then
              echo "✅ Attempt 3 succeeded"
              ICON_OK=1
            else
              echo "⚠️ Attempt 3 failed"
              rm -f "${ICON_PATH}" || true
            fi
          fi

          # ── Attempt 4: thumbnail/export URL ──
          if [ "${ICON_OK}" -eq 0 ]; then
            echo ""
            echo "🔄 Attempt 4: Thumbnail export URL..."
            curl -fsSL \
              --retry 3 \
              --max-time 60 \
              "https://drive.google.com/thumbnail?id=${FILE_ID}&sz=w1024" \
              -o "${ICON_PATH}" || true

            if file "${ICON_PATH}" 2>/dev/null | grep -q "PNG\|JPEG\|image"; then
              # Convert to PNG if needed
              if ! file "${ICON_PATH}" | grep -q "PNG"; then
                convert "${ICON_PATH}" /tmp/icon_converted.png && \
                  mv /tmp/icon_converted.png "${ICON_PATH}" || true
              fi

              if file "${ICON_PATH}" 2>/dev/null | grep -q "PNG"; then
                echo "✅ Attempt 4 succeeded"
                ICON_OK=1
              else
                rm -f "${ICON_PATH}"
              fi
            else
              echo "⚠️ Attempt 4 failed"
              rm -f "${ICON_PATH}" || true
            fi
          fi

          # ── Fallback: Generate a solid colour placeholder ──
          if [ "${ICON_OK}" -eq 0 ]; then
            echo ""
            echo "⚠️ All download attempts failed."
            echo "⚠️ Generating placeholder icon (blue with E letter)..."
            echo ""
            echo "👉 TO FIX PERMANENTLY:"
            echo "   1. Commit assets/icon.png to your git repository"
            echo "   2. OR make sure the Google Drive file is publicly shared"

            convert -size 1024x1024 xc:'#1A73E8' \
              -fill white \
              -font DejaVu-Sans-Bold \
              -pointsize 400 \
              -gravity Center \
              -annotate 0 "E" \
              "${ICON_PATH}" 2>/dev/null || python3 - <<'PY'
          import struct, zlib, pathlib

          def chunk(tag, data):
              crc = zlib.crc32(tag + data) & 0xFFFFFFFF
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", crc)

          w = h = 512
          raw = b""
          for y in range(h):
              raw += b"\x00"
              for x in range(w):
                  raw += bytes([26, 115, 232])

          ihdr = struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", ihdr)
              + chunk(b"IDAT", zlib.compress(raw, 9))
              + chunk(b"IEND", b"")
          )
          pathlib.Path("assets/icon.png").write_bytes(png)
          print("✅ Fallback PNG written (512x512 blue solid)")
          PY
            ICON_OK=1
          fi

          # ── Final validation ──
          echo ""
          echo "=== Final Icon Validation ==="
          if [ ! -f "${ICON_PATH}" ]; then
            echo "❌ Icon file does not exist — cannot continue"
            exit 1
          fi

          file "${ICON_PATH}"
          echo "Size: $(wc -c < "${ICON_PATH}") bytes"

          if command -v identify &>/dev/null; then
            W=$(identify -format "%w" "${ICON_PATH}" 2>/dev/null || echo "?")
            H=$(identify -format "%h" "${ICON_PATH}" 2>/dev/null || echo "?")
            echo "Dimensions: ${W}x${H} px"
          fi

          if ! file "${ICON_PATH}" | grep -qE "PNG|image"; then
            echo "❌ Final file is not a valid image — aborting"
            exit 1
          fi

          echo ""
          echo "✅ Icon is ready for flutter_launcher_icons"

      - name: Generate launcher icons
        run: |
          set -euo pipefail
          flutter pub run flutter_launcher_icons
          echo "✅ Launcher icons generated successfully"

      # ─────────────────────────────────────────
      # 11. BUILD RELEASE APK
      # ─────────────────────────────────────────
      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EH_WORKER_BASE_URL: ${{ secrets.EH_WORKER_BASE_URL }}
          FLW_PUBLIC_KEY_TEST: ${{ secrets.FLW_PUBLIC_KEY_TEST }}
          FLW_PUBLIC_KEY_LIVE: ${{ secrets.FLW_PUBLIC_KEY_LIVE }}
        run: |
          set -euo pipefail

          [ -n "${EH_WORKER_BASE_URL:-}" ] || \
            { echo "::error::EH_WORKER_BASE_URL secret is not set"; exit 1; }

          DART_DEFINES=""
          DART_DEFINES+=" --dart-define=CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
          DART_DEFINES+=" --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET=${CLOUDINARY_UNSIGNED_UPLOAD_PRESET}"
          DART_DEFINES+=" --dart-define=EH_WORKER_BASE_URL=${EH_WORKER_BASE_URL}"

          if [ -n "${FLW_PUBLIC_KEY_LIVE:-}" ]; then
            DART_DEFINES+=" --dart-define=FLW_PUBLIC_KEY_LIVE=${FLW_PUBLIC_KEY_LIVE}"
            DART_DEFINES+=" --dart-define=FLW_TEST_MODE=false"
            echo "Using LIVE Flutterwave key"
          elif [ -n "${FLW_PUBLIC_KEY_TEST:-}" ]; then
            DART_DEFINES+=" --dart-define=FLW_PUBLIC_KEY_TEST=${FLW_PUBLIC_KEY_TEST}"
            DART_DEFINES+=" --dart-define=FLW_TEST_MODE=true"
            echo "Using TEST Flutterwave key"
          fi

          flutter build apk \
            --release \
            --no-tree-shake-icons \
            ${DART_DEFINES}

          echo "✅ APK built successfully"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          [ -f "$APK" ] || { echo "❌ ERROR: APK not found"; exit 1; }
          echo "✅ APK size: $(du -h $APK | cut -f1)"

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS_VER="$(ls "${SDK_DIR}/build-tools" | sort -V | tail -1)"
          APKSIGNER="${SDK_DIR}/build-tools/${BUILD_TOOLS_VER}/apksigner"

          if [ -f "${APKSIGNER}" ]; then
            "${APKSIGNER}" verify --print-certs "$APK" \
              && echo "✅ APK signature valid" \
              || echo "⚠️ APK signature check warning"
          else
            echo "⚠️ apksigner not found — skipping"
          fi

          ls -lh build/app/outputs/flutter-apk/

      # ─────────────────────────────────────────
      # 12. BUILD RELEASE AAB (Play Store)
      # ─────────────────────────────────────────
      - name: Build Release AAB (Play Store)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EH_WORKER_BASE_URL: ${{ secrets.EH_WORKER_BASE_URL }}
          FLW_PUBLIC_KEY_TEST: ${{ secrets.FLW_PUBLIC_KEY_TEST }}
          FLW_PUBLIC_KEY_LIVE: ${{ secrets.FLW_PUBLIC_KEY_LIVE }}
        run: |
          set -euo pipefail

          DART_DEFINES=""
          DART_DEFINES+=" --dart-define=CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
          DART_DEFINES+=" --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET=${CLOUDINARY_UNSIGNED_UPLOAD_PRESET}"
          DART_DEFINES+=" --dart-define=EH_WORKER_BASE_URL=${EH_WORKER_BASE_URL}"

          if [ -n "${FLW_PUBLIC_KEY_LIVE:-}" ]; then
            DART_DEFINES+=" --dart-define=FLW_PUBLIC_KEY_LIVE=${FLW_PUBLIC_KEY_LIVE}"
            DART_DEFINES+=" --dart-define=FLW_TEST_MODE=false"
            echo "Using LIVE Flutterwave key"
          elif [ -n "${FLW_PUBLIC_KEY_TEST:-}" ]; then
            DART_DEFINES+=" --dart-define=FLW_PUBLIC_KEY_TEST=${FLW_PUBLIC_KEY_TEST}"
            DART_DEFINES+=" --dart-define=FLW_TEST_MODE=true"
            echo "Using TEST Flutterwave key"
          fi

          flutter build appbundle \
            --release \
            --no-tree-shake-icons \
            ${DART_DEFINES}

          echo "✅ AAB built successfully"

      - name: Verify AAB
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          [ -f "$AAB" ] || { echo "❌ ERROR: AAB not found"; exit 1; }
          echo "✅ AAB size: $(du -h $AAB | cut -f1)"
          ls -lh build/app/outputs/bundle/release/

      # ─────────────────────────────────────────
      # 13. UPLOAD ARTIFACTS
      # ─────────────────────────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ─────────────────────────────────────────
      # 14. SUMMARY
      # ─────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "============================================"
          echo "✅ BUILD COMPLETE"
          echo "============================================"
          echo ""
          echo "📱 APK (Direct install / sideload / testing):"
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo ""
          echo "🏪 AAB (Upload THIS to Google Play Store):"
          ls -lh build/app/outputs/bundle/release/app-release.aab
          echo ""
          echo "How to download artifacts:"
          echo "  Actions → This workflow run → Artifacts section"
          echo "  Download 'app-release-aab' → upload .aab to Play Console"
          echo "============================================"
