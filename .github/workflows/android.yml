name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDINARY_CLOUD_NAME: dbw9zpkxi
      CLOUDINARY_UNSIGNED_UPLOAD_PRESET: eSportlyic_unsigned

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Resolve Flutter SDK path (FLUTTER_ROOT)
        run: |
          FLUTTER_BIN="$(which flutter)"
          echo "flutter bin: $FLUTTER_BIN"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          echo "Resolved FLUTTER_ROOT=$FLUTTER_ROOT"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"

      - name: Write android/local.properties (required for Gradle)
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "Using Android SDK at: $SDK_DIR"
          echo "flutter.sdk=${FLUTTER_ROOT}" > android/local.properties
          echo "sdk.dir=${SDK_DIR}" >> android/local.properties
          echo "--- android/local.properties ---"
          cat android/local.properties

      - name: Install dependencies
        run: flutter pub get

      # ===============================
      # NEW STEPS FOR LAUNCHER ICONS
      # ===============================

      - name: Clean old launcher icons
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          rm -f android/app/src/main/res/drawable/ic_launcher*
          rm -rf android/app/src/main/res/drawable-anydpi*
          find android/app/src/main/res/ -type f -name "*launcher*" -delete

      - name: Download new launcher icon
        run: |
          mkdir -p assets
          curl -L -o assets/icon.png "https://drive.google.com/uc?export=download&id=1tsB5ZVBNWke_wlrCuKiOiXMrGSPEqZZd"

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      # ===============================
      # CONTINUE BUILD
      # ===============================

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=CLOUDINARY_CLOUD_NAME="${{ env.CLOUDINARY_CLOUD_NAME }}" \
            --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET="${{ env.CLOUDINARY_UNSIGNED_UPLOAD_PRESET }}"

      - name: Show build outputs
        run: |
          ls -la build/app/outputs || true
          ls -la build/app/outputs/flutter-apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
