name: Android CI (Release APK + AAB - Production)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CLOUDINARY_CLOUD_NAME: dbw9zpkxi
      CLOUDINARY_UNSIGNED_UPLOAD_PRESET: eSportlyic_unsigned
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      ICON_FILE_ID: "1ynEFtKZCC-mQPegEQKw7QqjRU_KCYqA4"

    steps:
      # ─────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────
      - name: Checkout (with retries)
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          ok=0
          for i in 1 2 3 4 5 6; do
            echo "Checkout attempt ${i}/6..."
            find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} + || true
            rm -rf .git || true
            git init -q
            git config gc.auto 0
            git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
            if git -c protocol.version=2 fetch \
                --no-tags --prune --no-recurse-submodules \
                --depth=1 origin "${SHA}"; then
              git checkout --detach -q FETCH_HEAD
              echo "✅ Checked out: $(git rev-parse HEAD)"
              ok=1
              break
            fi
            sleep $((i * 15))
          done
          [ "${ok}" -eq 1 ] || { echo "ERROR: Checkout failed"; exit 1; }

      # ─────────────────────────────────────────
      # 2. PREPARE DIRECTORIES
      # ─────────────────────────────────────────
      - name: Prepare directories
        run: |
          mkdir -p "${PUB_CACHE}"
          mkdir -p "${GRADLE_USER_HOME}"

      # ─────────────────────────────────────────
      # 3. JAVA
      # ─────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─────────────────────────────────────────
      # 4. CACHES
      # ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties','**/*.gradle*','**/settings.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # ─────────────────────────────────────────
      # 5. SYSTEM DEPS
      # ─────────────────────────────────────────
      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xz-utils unzip curl git libglu1-mesa imagemagick file python3 binutils
          sudo apt-get clean

      # ─────────────────────────────────────────
      # 6. FLUTTER (via Official Action)
      # ─────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          flutter config --no-analytics
          flutter doctor -v

      # ─────────────────────────────────────────
      # 7. LOCAL PROPERTIES
      # ─────────────────────────────────────────
      - name: Write android/local.properties
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "${SDK_DIR}" ] || { echo "ERROR: No Android SDK"; exit 1; }
          # Dynamically get Flutter path from the subosito action
          ACTUAL_FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=${ACTUAL_FLUTTER_ROOT}" > android/local.properties
          echo "sdk.dir=${SDK_DIR}"          >> android/local.properties
          echo "flutter.versionCode=21"      >> android/local.properties
          echo "flutter.versionName=1.0.0"   >> android/local.properties

      # ─────────────────────────────────────────
      # 8. RELEASE KEYSTORE
      # ─────────────────────────────────────────
      - name: Restore Release Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p android/app/keystore

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::KEYSTORE_B64 secret is missing!"
            exit 1
          fi

          python3 - <<'PY'
          import os, base64, pathlib
          b64 = os.environ["KEYSTORE_B64"].strip() \
                  .replace("\n","").replace("\r","")
          b64 += "=" * ((4 - len(b64) % 4) % 4)
          data = base64.b64decode(b64, validate=False)
          out = pathlib.Path("android/app/keystore/release.keystore")
          out.write_bytes(data)
          print(f"✅ Wrote {len(data)} bytes → {out}")
          PY

          echo "KEYSTORE_PATH=$(pwd)/android/app/keystore/release.keystore" \
            >> "$GITHUB_ENV"

      - name: Verify Release Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "Keystore size: $(wc -c < "${KEYSTORE_PATH}") bytes"
          keytool -list \
            -keystore "${KEYSTORE_PATH}" \
            -alias "${KEY_ALIAS}" \
            -storepass "${STORE_PASSWORD}" | grep -E "fingerprint|Entry type:" || true
          echo "✅ Keystore is valid"

      # ─────────────────────────────────────────
      # 9. PUB GET
      # ─────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ─────────────────────────────────────────
      # 10. LAUNCHER ICON
      # ─────────────────────────────────────────
      - name: Clean old launcher icons
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          rm -f  android/app/src/main/res/drawable/ic_launcher*
          rm -rf android/app/src/main/res/drawable-anydpi*
          find android/app/src/main/res/ -type f -name "*launcher*" -delete

      - name: Download launcher icon from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          FILE_ID="${ICON_FILE_ID}"
          ICON_PATH="assets/icon.png"
          COOKIE_JAR="/tmp/gdrive_cookies.txt"
          ICON_OK=0

          echo "================================================"
          echo "Downloading icon: File ID = ${FILE_ID}"
          echo "================================================"

          # Helper: check if file is a valid PNG/image
          is_valid_image() {
            local f="$1"
            [ -f "${f}" ] && [ "$(wc -c < "${f}")" -gt 1000 ] \
              && file "${f}" 2>/dev/null | grep -qE "PNG|image"
          }

          # ── Attempt 1: drive.usercontent.google.com (newer endpoint) ──
          echo ""
          echo "🔄 Attempt 1: drive.usercontent.google.com..."
          curl -fsSL \
            --retry 3 --retry-delay 3 --max-time 60 \
            -A "Mozilla/5.0 (X11; Linux x86_64)" \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&authuser=0&confirm=t" \
            -o "${ICON_PATH}" || true

          if is_valid_image "${ICON_PATH}"; then
            echo "✅ Attempt 1 succeeded"
            ICON_OK=1
          else
            echo "⚠️ Attempt 1 failed"
            rm -f "${ICON_PATH}"
          fi

          # ── Attempt 2: Classic uc endpoint with confirm ──
          if [ "${ICON_OK}" -eq 0 ]; then
            echo ""
            echo "🔄 Attempt 2: Classic uc endpoint with confirm=t..."
            curl -fsSL \
              --retry 3 --retry-delay 3 --max-time 60 \
              -A "Mozilla/5.0 (X11; Linux x86_64)" \
              "https://drive.google.com/uc?export=download&confirm=t&id=${FILE_ID}" \
              -o "${ICON_PATH}" || true

            if is_valid_image "${ICON_PATH}"; then
              echo "✅ Attempt 2 succeeded"
              ICON_OK=1
            else
              echo "⚠️ Attempt 2 failed"
              rm -f "${ICON_PATH}"
            fi
          fi

          # ── Attempt 3: With cookie jar + follow redirects ──
          if [ "${ICON_OK}" -eq 0 ]; then
            echo ""
            echo "🔄 Attempt 3: Cookie jar + follow redirects..."
            rm -f "${COOKIE_JAR}"

            # First request to get cookies
            curl -sL \
              --retry 2 --max-time 60 \
              -A "Mozilla/5.0 (X11; Linux x86_64)" \
              --cookie-jar "${COOKIE_JAR}" \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
              -o "${ICON_PATH}" || true

            if is_valid_image "${ICON_PATH}"; then
              echo "✅ Attempt 3 (first request) succeeded"
              ICON_OK=1
            else
              rm -f "${ICON_PATH}"
              # Second request with cookies + confirm
              curl -sL \
                --retry 2 --max-time 60 \
                -A "Mozilla/5.0 (X11; Linux x86_64)" \
                --cookie "${COOKIE_JAR}" \
                --cookie-jar "${COOKIE_JAR}" \
                "https://drive.google.com/uc?export=download&confirm=t&id=${FILE_ID}" \
                -o "${ICON_PATH}" || true

              if is_valid_image "${ICON_PATH}"; then
                echo "✅ Attempt 3 (with cookies) succeeded"
                ICON_OK=1
              else
                echo "⚠️ Attempt 3 failed"
                rm -f "${ICON_PATH}"
              fi
            fi
          fi

          # ── Attempt 4: Python gdown-style download ──
          if [ "${ICON_OK}" -eq 0 ]; then
            echo ""
            echo "🔄 Attempt 4: Python-based download..."
            python3 - <<PYEOF
          import urllib.request, urllib.parse, http.cookiejar, os, sys

          file_id = os.environ["ICON_FILE_ID"]
          out_path = "assets/icon.png"

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          opener.addheaders = [("User-Agent", "Mozilla/5.0 (X11; Linux x86_64)")]

          urls = [
              f"https://drive.usercontent.google.com/download?id={file_id}&export=download&authuser=0&confirm=t",
              f"https://drive.google.com/uc?export=download&confirm=t&id={file_id}",
          ]

          for url in urls:
              try:
                  print(f"  Trying: {url[:80]}...")
                  with opener.open(url, timeout=60) as r:
                      data = r.read()
                  if len(data) > 1000 and (data[:4] == b'\x89PNG' or b'PNG' in data[:16]):
                      with open(out_path, "wb") as f:
                          f.write(data)
                      print(f"✅ Python download succeeded: {len(data)} bytes")
                      sys.exit(0)
                  else:
                      print(f"  ⚠️ Got {len(data)} bytes but not a PNG")
              except Exception as e:
                  print(f"  ⚠️ Error: {e}")

          print("❌ All Python attempts failed")
          sys.exit(1)
          PYEOF

            if is_valid_image "${ICON_PATH}"; then
              echo "✅ Attempt 4 succeeded"
              ICON_OK=1
            else
              echo "⚠️ Attempt 4 failed"
              rm -f "${ICON_PATH}"
            fi
          fi

          # ── Fallback: Generate a placeholder icon using ImageMagick ──
          if [ "${ICON_OK}" -eq 0 ]; then
            echo ""
            echo "⚠️ All download attempts failed."
            echo "🎨 Generating placeholder icon with ImageMagick..."

            convert -size 1024x1024 xc:"#1a237e" \
              -fill white \
              -font DejaVu-Sans-Bold \
              -pointsize 200 \
              -gravity center \
              -annotate 0 "E" \
              "${ICON_PATH}" 2>/dev/null || \
            convert -size 1024x1024 \
              gradient:"#1a237e-#4a148c" \
              "${ICON_PATH}" 2>/dev/null || \
            python3 - <<'PYEOF'
          import struct, zlib, pathlib

          def make_png(size=1024, r=26, g=35, b=126):
              def chunk(tag, data):
                  c = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", c)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0))
              raw = b''
              for _ in range(size):
                  raw += b'\x00' + bytes([r, g, b] * size)
              idat = chunk(b'IDAT', zlib.compress(raw, 1))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend

          pathlib.Path("assets/icon.png").write_bytes(make_png())
          print("✅ Pure-Python PNG placeholder created")
          PYEOF

            if is_valid_image "${ICON_PATH}"; then
              echo "✅ Placeholder icon generated successfully"
              ICON_OK=1
              echo "::warning::Using placeholder icon — Google Drive download failed. Replace assets/icon.png with your real icon."
            else
              echo "❌ Even placeholder generation failed"
              exit 1
            fi
          fi

          # ── Final validation ──
          echo ""
          echo "=== Final Icon Validation ==="
          file "${ICON_PATH}"
          echo "Size: $(wc -c < "${ICON_PATH}") bytes"

          if command -v identify &>/dev/null; then
            W=$(identify -format "%w" "${ICON_PATH}" 2>/dev/null || echo "?")
            H=$(identify -format "%h" "${ICON_PATH}" 2>/dev/null || echo "?")
            echo "Dimensions: ${W}x${H} px"
          fi

          echo "✅ Icon is ready for flutter_launcher_icons"

      - name: Generate launcher icons
        run: |
          set -euo pipefail
          flutter pub run flutter_launcher_icons
          echo "✅ Launcher icons generated successfully"

      # ─────────────────────────────────────────
      # 11. BUILD RELEASE APK
      # ─────────────────────────────────────────
      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EH_WORKER_BASE_URL: ${{ secrets.EH_WORKER_BASE_URL }}
          FLW_PUBLIC_KEY_TEST: ${{ secrets.FLW_PUBLIC_KEY_TEST }}
          FLW_PUBLIC_KEY_LIVE: ${{ secrets.FLW_PUBLIC_KEY_LIVE }}
        run: |
          set -euo pipefail

          [ -n "${EH_WORKER_BASE_URL:-}" ] || \
            { echo "::error::EH_WORKER_BASE_URL secret is not set"; exit 1; }

          DART_DEFINES=""
          DART_DEFINES+=" --dart-define=CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
          DART_DEFINES+=" --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET=${CLOUDINARY_UNSIGNED_UPLOAD_PRESET}"
          DART_DEFINES+=" --dart-define=EH_WORKER_BASE_URL=${EH_WORKER_BASE_URL}"

          if [ -n "${FLW_PUBLIC_KEY_LIVE:-}" ]; then
            DART_DEFINES+=" --dart-define=FLW_PUBLIC_KEY_LIVE=${FLW_PUBLIC_KEY_LIVE}"
            DART_DEFINES+=" --dart-define=FLW_TEST_MODE=false"
            echo "Using LIVE Flutterwave key"
          elif [ -n "${FLW_PUBLIC_KEY_TEST:-}" ]; then
            DART_DEFINES+=" --dart-define=FLW_PUBLIC_KEY_TEST=${FLW_PUBLIC_KEY_TEST}"
            DART_DEFINES+=" --dart-define=FLW_TEST_MODE=true"
            echo "Using TEST Flutterwave key"
          fi

          flutter build apk \
            --release \
            --no-tree-shake-icons \
            ${DART_DEFINES}

          echo "✅ APK built successfully"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          [ -f "$APK" ] || { echo "❌ ERROR: APK not found"; exit 1; }
          echo "✅ APK size: $(du -h $APK | cut -f1)"

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS_VER="$(ls "${SDK_DIR}/build-tools" | sort -V | tail -1)"
          APKSIGNER="${SDK_DIR}/build-tools/${BUILD_TOOLS_VER}/apksigner"

          if [ -f "${APKSIGNER}" ]; then
            "${APKSIGNER}" verify --print-certs "$APK" \
              && echo "✅ APK signature valid" \
              || echo "⚠️ APK signature check warning"
          else
            echo "⚠️ apksigner not found — skipping"
          fi

          ls -lh build/app/outputs/flutter-apk/

      # ─────────────────────────────────────────
      # 12. BUILD RELEASE AAB (Play Store)
      # ─────────────────────────────────────────
      - name: Build Release AAB (Play Store)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EH_WORKER_BASE_URL: ${{ secrets.EH_WORKER_BASE_URL }}
          FLW_PUBLIC_KEY_TEST: ${{ secrets.FLW_PUBLIC_KEY_TEST }}
          FLW_PUBLIC_KEY_LIVE: ${{ secrets.FLW_PUBLIC_KEY_LIVE }}
        run: |
          set -euo pipefail

          DART_DEFINES=""
          DART_DEFINES+=" --dart-define=CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
          DART_DEFINES+=" --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET=${CLOUDINARY_UNSIGNED_UPLOAD_PRESET}"
          DART_DEFINES+=" --dart-define=EH_WORKER_BASE_URL=${EH_WORKER_BASE_URL}"

          if [ -n "${FLW_PUBLIC_KEY_LIVE:-}" ]; then
            DART_DEFINES+=" --dart-define=FLW_PUBLIC_KEY_LIVE=${FLW_PUBLIC_KEY_LIVE}"
            DART_DEFINES+=" --dart-define=FLW_TEST_MODE=false"
            echo "Using LIVE Flutterwave key"
          elif [ -n "${FLW_PUBLIC_KEY_TEST:-}" ]; then
            DART_DEFINES+=" --dart-define=FLW_PUBLIC_KEY_TEST=${FLW_PUBLIC_KEY_TEST}"
            DART_DEFINES+=" --dart-define=FLW_TEST_MODE=true"
            echo "Using TEST Flutterwave key"
          fi

          flutter build appbundle \
            --release \
            --no-tree-shake-icons \
            ${DART_DEFINES}

          echo "✅ AAB built successfully"

      - name: Verify AAB
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          [ -f "$AAB" ] || { echo "❌ ERROR: AAB not found"; exit 1; }
          echo "✅ AAB size: $(du -h $AAB | cut -f1)"
          ls -lh build/app/outputs/bundle/release/

      # ─────────────────────────────────────────
      # 12b. CHECK 16 KB PAGE-SIZE ALIGNMENT
      # ─────────────────────────────────────────
      - name: Check 16 KB page-size alignment
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          EXTRACT_DIR="/tmp/aab_extract"

          rm -rf "${EXTRACT_DIR}"
          mkdir -p "${EXTRACT_DIR}"
          unzip -oq "${AAB}" -d "${EXTRACT_DIR}"

          echo "============================================"
          echo "16 KB PAGE-SIZE ALIGNMENT REPORT"
          echo "Compliant .so files must have a LOAD segment"
          echo "'Align' value of 0x4000 (16384) or higher."
          echo "============================================"
          echo ""

          declare -a NON_COMPLIANT

          SO_FILES=$(find "${EXTRACT_DIR}" -name "*.so" | sort)

          if [ -z "${SO_FILES}" ]; then
            echo "No .so files found in the AAB — nothing to check."
          else
            printf "%-70s %-12s %-10s\n" "LIBRARY" "ABI" "ALIGN"
            printf "%-70s %-12s %-10s\n" "-------" "---" "-----"

            while IFS= read -r so; do
              REL_PATH="${so#${EXTRACT_DIR}/}"
              ABI=$(echo "${REL_PATH}" | grep -oE "arm64-v8a|armeabi-v7a|x86_64|x86" || echo "unknown")
              LIB_NAME=$(basename "${so}")

              # Extract max Align value across all LOAD segments
              MAX_ALIGN_DEC=0
              MAX_ALIGN_HEX="0x0"
              while IFS= read -r align_hex; do
                align_hex_clean=$(echo "${align_hex}" | tr -d '[:space:]')
                if [ -n "${align_hex_clean}" ]; then
                  align_dec=$((16#${align_hex_clean#0x}))
                  if [ "${align_dec}" -gt "${MAX_ALIGN_DEC}" ]; then
                    MAX_ALIGN_DEC=${align_dec}
                    MAX_ALIGN_HEX=${align_hex_clean}
                  fi
                fi
              done < <(readelf -lW "${so}" 2>/dev/null | awk '/LOAD/{print $NF}')

              printf "%-70s %-12s %-10s\n" "${LIB_NAME}" "${ABI}" "${MAX_ALIGN_HEX}"

              if [ "${MAX_ALIGN_DEC}" -lt 16384 ]; then
                NON_COMPLIANT+=("${REL_PATH} (align=${MAX_ALIGN_HEX})")
              fi
            done <<< "${SO_FILES}"
          fi

          echo ""
          echo "============================================"
          if [ "${#NON_COMPLIANT[@]:-0}" -eq 0 ]; then
            echo "✅ All native libraries are 16 KB page-size aligned."
          else
            echo "⚠️  NON-COMPLIANT LIBRARIES FOUND (${#NON_COMPLIANT[@]}):"
            for entry in "${NON_COMPLIANT[@]}"; do
              echo "   - ${entry}"
            done
            echo ""
            echo "These come from a Flutter/Android plugin's prebuilt native"
            echo "library. Trace each path back to the plugin (e.g. a path"
            echo "containing 'flutter_webrtc', 'livekit', 'record', etc.) and"
            echo "check for a newer version of that plugin that ships a"
            echo "16 KB-aligned build."
            echo "::warning::Non-16KB-aligned native libraries detected — see job log for details."
          fi
          echo "============================================"

      # ─────────────────────────────────────────
      # 13. UPLOAD ARTIFACTS
      # ─────────────────────────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ─────────────────────────────────────────
      # 14. SUMMARY
      # ─────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "============================================"
          echo "✅ BUILD COMPLETE"
          echo "============================================"
          echo ""
          echo "📱 APK (Direct install / sideload / testing):"
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo ""
          echo "🏪 AAB (Upload THIS to Google Play Store):"
          ls -lh build/app/outputs/bundle/release/app-release.aab
          echo ""
          echo "How to download artifacts:"
          echo "  Actions → This workflow run → Artifacts section"
          echo "  Download 'app-release-aab' → upload .aab to Play Console"
          echo "============================================"
