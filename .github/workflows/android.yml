name: Android CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDINARY_CLOUD_NAME: dbw9zpkxi
      CLOUDINARY_UNSIGNED_UPLOAD_PRESET: eSportlyic_unsigned
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create local.properties
        run: |
          FLUTTER_SDK="$(flutter --no-version-check config --machine 2>/dev/null | grep '"flutter-sdk"' | cut -d'"' -f4)"
          if [ -z "$FLUTTER_SDK" ]; then
            FLUTTER_SDK="$(dirname $(dirname $(which flutter)))"
          fi
          echo "Flutter SDK at: $FLUTTER_SDK"
          ls -la "$FLUTTER_SDK/packages/flutter_tools/gradle/" || echo "gradle dir not found, trying to find it..."
          find / -path "*/packages/flutter_tools/gradle" -type d 2>/dev/null | head -5
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_SDK" >> android/local.properties
          echo "--- local.properties ---"
          cat android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Verify local.properties
        run: |
          echo "--- local.properties after pub get ---"
          cat android/local.properties

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME \
            --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET=$CLOUDINARY_UNSIGNED_UPLOAD_PRESET

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
