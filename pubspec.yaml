name: eleaguehub3
description: "A high-end professional league management app."
publish_to: 'none'
version: 1.5.0+25

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  cupertino_icons: ^1.0.6

  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.2
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.6
  google_sign_in: ^6.2.1
  firebase_crashlytics: ^4.1.0
  firebase_storage: ^12.3.7

  supabase_flutter: ^2.8.3

  app_links: ^6.4.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  uuid: ^4.2.2
  intl: ^0.20.3
  share_plus: ^10.1.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  cloudinary_public: ^0.23.1
  http: ^1.2.2
  dio: ^5.7.0
  mime: ^1.0.6
  path_provider: ^2.1.5
  flutterwave_standard: ^1.0.9
  flutter_webrtc: ^1.5.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  livekit_client: ^2.5.0+hotfix.3
  marquee: ^2.2.3
  record: ^6.0.0
  just_audio: ^0.9.38
  path: ^1.9.0
  google_mobile_ads: ^5.1.0
  # ── Google Play Billing (Android in-app purchases) ──
  # Pinned in_app_purchase_android via override below to guarantee
  # Billing Library 8.0.0+ regardless of what in_app_purchase's own
  # pubspec constraint would otherwise resolve to.
  in_app_purchase: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# ── Forces the Android platform implementation to a version that ships
# Google Play Billing Library 8.0.0+ (required by Google Play from
# 31 Aug 2026). in_app_purchase_android 0.5.0 is the version that bumped
# Billing Library from 7.1.1 to 8.0.0; 0.5.2 is current latest.
dependency_overrides:
  in_app_purchase_android: ^0.5.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true