name: eleaguehub3
description: "A high-end professional league management app."
publish_to: 'none'
version: 1.0.0+21

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.2
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.1
  firebase_crashlytics: ^4.1.0
  firebase_storage: ^12.3.7

  # UI-only preferences (allowed minimal persistence)
  shared_preferences: ^2.2.3

  # Features
  connectivity_plus: ^6.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  uuid: ^4.2.2
  intl: ^0.19.0
  share_plus: ^10.1.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

  # Cloudinary (unsigned upload preset)
  cloudinary_public: ^0.23.1

  http: ^1.2.2

  # Payments (Flutterwave)
  flutterwave_standard: ^1.0.9

  # Local LAN Streaming (Screen + Front Camera) via WebRTC
  flutter_webrtc: 0.12.5+hotfix.2
  permission_handler: ^11.3.1

  # Local notifications (for app creator via SettingsScreen)
  flutter_local_notifications: ^17.2.3

  livekit_client: 2.3.6

  # Marquee scrolling text (for announcements)
  marquee: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
