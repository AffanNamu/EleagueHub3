name: eleaguehub3
description: "A high-end professional league management app."
publish_to: 'none'
version: 1.0.0+21

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.2
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.6
  google_sign_in: ^6.2.1
  firebase_crashlytics: ^4.1.0
  firebase_storage: ^12.3.7

  # Deep links (AGP 8+ compatible). Replaces uni_links which fails release manifest processing.
  app_links: ^6.4.0

  # UI-only preferences (allowed minimal persistence)
  shared_preferences: ^2.2.3

  # Features
  connectivity_plus: ^6.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  uuid: ^4.2.2
  intl: ^0.19.0
  share_plus: ^10.1.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

  # Cloudinary (unsigned upload preset)
  cloudinary_public: ^0.23.1

  http: ^1.2.2

  # Payments (Flutterwave)
  flutterwave_standard: ^1.0.9

  # Local LAN Streaming (Screen + Front Camera) via WebRTC
  flutter_webrtc: 0.12.5+hotfix.2
  permission_handler: ^11.3.1

  # Local notifications (for app creator via SettingsScreen)
  flutter_local_notifications: ^17.2.3

  livekit_client: 2.3.6

  # Marquee scrolling text (for announcements)
  marquee: ^2.2.3

  # Voice messages (record + playback)
  #
  # record 4.x fails on AGP 8+ because it uses `package="..."` in its plugin AndroidManifest.xml
  # which is no longer supported for namespace.
  # Use record 6.x which is compatible with modern Flutter + AGP.
  record: ^6.0.0
  just_audio: ^0.9.38
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
