name: eleaguehub3
description: "A high-end professional league management app."
publish_to: 'none'
version: 1.9.7+73

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  cupertino_icons: ^1.0.6

  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.2
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.6
  google_sign_in: ^6.2.1
  firebase_crashlytics: ^4.1.0
  firebase_storage: ^12.3.7

  supabase_flutter: ^2.8.3

  app_links: ^6.4.0
  shared_preferences: ^2.2.3
  # ── Pinned below 7.1.0: 7.1.0+ references NWPath.isUltraConstrained
  # (an iOS 26 SDK API) in its Swift source, guarded by #available at
  # runtime but still required to exist in the SDK at compile time.
  # This CI's Xcode (16.4, iOS 18.5 SDK) doesn't have that symbol, so
  # 7.1.0+ fails with "value of type 'NWPath' has no member
  # 'isUltraConstrained'" during archive. Upstream tracking:
  # https://github.com/fluttercommunity/plus_plugins/issues/3787
  # (closed as not planned) — bump back to ^7.x once CI's Xcode ships
  # the iOS 26 SDK.
  connectivity_plus: ">=7.0.0 <7.1.0"
  qr_flutter: ^4.1.0
  # ── Bumped from ^5.1.0: 5.x bundles a pre-16KB-aligned CameraX/ML Kit
  # native build (libbarhopper_v3.so, libimage_processing_util_jni.so),
  # which is what Google Play's "16 KB memory page sizes" rejection is
  # flagging. Fixed upstream in mobile_scanner 6.0.11+; pinned to the
  # current latest (7.4.0) which includes it.
  mobile_scanner: ^7.4.0
  uuid: ^4.2.2
  intl: ^0.20.3
  share_plus: ^10.1.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  cloudinary_public: ^0.23.1
  http: ^1.2.2
  dio: ^5.7.0
  mime: ^1.0.6
  path_provider: ^2.1.5
  flutterwave_standard: ^1.0.9
  flutter_webrtc: ^1.5.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  livekit_client: ^2.8.1
  marquee: ^2.2.3
  record: ^6.0.0
  just_audio: ^0.9.38
  path: ^1.9.0
  # ── Pinned below 9.1.0: 9.1.0 added FLTAdPreloader.h (Ad Preloading
  # APIs), whose FLTAd_Internal.h non-modularly #imports
  # GoogleMobileAds/GoogleMobileAds_Beta.h -- a private header of the
  # GoogleMobileAds.framework XCFramework. Xcode's archive build
  # enforces -Wnon-modular-include-in-framework-module as an error,
  # failing with "Include of non-modular header inside framework
  # module 'google_mobile_ads.FLTAd_Internal'"/'.FLTAdPreloader'. The
  # Podfile-level CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES
  # override does not suppress this for archive builds. 9.0.0 doesn't
  # have FLTAdPreloader.h/the Beta header import at all (confirmed via
  # the plugin's own CHANGELOG.md), and still ships GMA iOS SDK 13.x
  # (13.3.0) -- same generation as 9.1.0's 13.7.0 -- so the
  # MobileAds.shared API used in AppDelegate.swift is unaffected.
  google_mobile_ads: ">=9.0.0 <9.1.0"
  # ── Explicit (not just transitive-via-google_mobile_ads) deps ──
  # google_mobile_ads depends on these for its iOS WebView-based ad
  # rendering. Its own native iOS podspec (verified against the
  # googleads-mobile-flutter GitHub source, still true as of 9.1.0) has
  # a bare, unversioned `s.dependency 'webview_flutter_wkwebview'` line —
  # a packaging defect on Google's side, since that pod is never
  # published to the public CocoaPods trunk and only resolves via
  # Flutter's local plugin symlinking. Declaring these directly (instead
  # of relying on them being pulled in transitively) plus the explicit
  # Podfile pod declaration below (see ios/Podfile) is required to get
  # CocoaPods to resolve it. Versions pinned to match google_mobile_ads
  # 9.1.0's own declared requirement exactly, to avoid a resolver conflict.
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.23.4
  webview_flutter_android: ^4.10.9
  # ── Google Play Billing (Android in-app purchases) ──
  # Pinned in_app_purchase_android via override below to guarantee
  # Billing Library 8.0.0+ regardless of what in_app_purchase's own
  # pubspec constraint would otherwise resolve to.
  in_app_purchase: ^3.2.3
  # ── Sign in with Apple ──
  # crypto: SHA-256 hashing for the OAuth nonce Apple requires.
  # sign_in_with_apple: native iOS/macOS authorization + the
  # web-redirect flow used on Android (Apple has no native Android SDK).
  crypto: ^3.0.5
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# ── Forces the Android platform implementation to a version that ships
# Google Play Billing Library 8.0.0+ (required by Google Play from
# 31 Aug 2026). in_app_purchase_android 0.5.0 is the version that bumped
# Billing Library from 7.1.1 to 8.0.0; 0.5.2 is current latest.
dependency_overrides:
  in_app_purchase_android: ^0.5.2
  # device_info_plus is only a transitive dependency (via
  # livekit_client: ^2.8.1, which itself depends on ^12.3.0), so pub
  # freely resolves it up to 12.4.0 -- which added an
  # NSProcessInfo.isiOSAppOnVision reference in its Objective-C source
  # requiring an iOS SDK newer than what this CI's Xcode (16.4, iOS
  # 18.5 SDK) ships, failing with "No visible @interface for
  # 'NSProcessInfo' declares the selector 'isiOSAppOnVision'" during
  # archive. Pinned to the last version before that reference was added.
  device_info_plus: 12.3.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
